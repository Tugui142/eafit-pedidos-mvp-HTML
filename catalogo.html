<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAFIT Pedidos</title>
    
    <!-- Enlace al nuevo CSS de EAFIT -->
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        eafit: {
                            oscuro: 'var(--eafit-azul-oscuro)',
                            claro: 'var(--eafit-azul-claro)',
                            amarillo: 'var(--eafit-amarillo)',
                            arena: 'var(--eafit-arena)'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#EFEFEF] text-[#222222] font-sans">
    
    <!-- Contenedor Wrapper para simular App Móvil en PC -->
    <div class="max-w-md mx-auto bg-white min-h-screen relative shadow-2xl pb-24 border-x border-gray-200">
        
        <!-- Navbar -->
        <nav class="bg-white p-4 shadow-sm flex justify-between items-center sticky top-0 z-40">
            <div class="flex items-center gap-3">
                <button onclick="toggleMenu()" class="text-2xl font-bold active:scale-95">≡</button>
                <h1 class="font-bold text-lg">EAFIT Pedidos</h1>
            </div>
            <button onclick="window.location.href='pago.html'" class="relative font-bold text-xl active:scale-95">
                🛒 <span id="cart-badge" class="absolute -top-1 -right-2 bg-red-600 text-white text-[10px] px-1.5 rounded-full hidden">0</span>
            </button>
        </nav>

        <!-- Menú Lateral -->
        <div id="side-menu" class="fixed inset-y-0 left-0 w-64 bg-white shadow-2xl transform -translate-x-full transition-transform z-50 p-6">
            <button onclick="toggleMenu()" class="font-bold text-xl mb-6 active:scale-95">✕ Cerrar</button>
            <ul class="space-y-4 font-bold text-gray-700">
                <li onclick="toggleMapModal(); toggleMenu()" class="hover:text-gray-900 cursor-pointer flex items-center gap-2">📍 Mapa del Campus</li>
                <li onclick="window.location.href='restaurantes.html'" class="hover:text-gray-900 cursor-pointer flex items-center gap-2">🍔 Restaurantes</li>
                <li onclick="window.location.href='historial.html'" class="hover:text-gray-900 cursor-pointer flex items-center gap-2">📦 Mis Pedidos</li>
                <li onclick="window.location.href='ajustes.html'" class="hover:text-gray-900 cursor-pointer flex items-center gap-2">⚙️ Ajustes</li>
                <li onclick="window.location.href='index.html'" class="text-red-600 cursor-pointer mt-8">Cerrar Sesión</li>
            </ul>
        </div>

        <!-- Modal del Mapa del Campus (Mejorado: Más grande e interactivo) -->
        <div id="map-modal" class="fixed inset-0 bg-black bg-opacity-70 z-50 hidden flex items-center justify-center p-3 backdrop-blur-sm transition-opacity">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg h-[82vh] overflow-hidden relative flex flex-col transform transition-all animate-fadeIn">
                
                <!-- Encabezado del Modal -->
                <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                    <div class="flex items-center gap-2">
                        <span class="text-xl">📍</span>
                        <h3 class="font-black text-gray-900 text-base">Mapa Interactivo - Campus EAFIT</h3>
                    </div>
                    <button onclick="toggleMapModal()" class="w-8 h-8 rounded-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold flex items-center justify-center text-lg active:scale-95 transition-all">✕</button>
                </div>

                <!-- Contenedor del Mapa (Ocupa todo el alto restante y permite interacción total) -->
                <div class="flex-1 w-full bg-gray-100 relative">
                    <iframe class="w-full h-full border-0" allowfullscreen src="https://umap.openstreetmap.de/en/map/universidad-eafit-campus-medellin_67039"></iframe>
                </div>

                <!-- Pie informativo opcional -->
                <div class="p-3 bg-gray-50 border-t border-gray-100 text-center">
                    <p class="text-xs text-gray-500 font-semibold">Toca o arrastra para explorar los bloques y plazoletas</p>
                </div>
            </div>
        </div>

        <div class="p-5 space-y-6">
            <!-- Saludo y Pregunta de acuerdo al wireframe -->
            <div>
                <h2 class="text-2xl font-black text-gray-900">¿Qué vas a pedir hoy?</h2>
            </div>

            <!-- Gráfico simplificado -->
            <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 shadow-sm">
                <p class="text-xs font-bold text-gray-500 uppercase tracking-wide">Demanda actual</p>
                <div class="h-24 w-full mt-2"><canvas id="congestionChart"></canvas></div>
            </div>

            <!-- Filtros scrolleables (Wireframe Paso 2) -->
            <div class="flex gap-2 overflow-x-auto hide-scroll pb-1 -mx-2 px-2">
                <button class="bg-gray-900 text-white px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap shadow-md">Todos</button>
                <button class="bg-white border border-gray-200 text-gray-600 px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap shadow-sm hover:bg-gray-50">Hamburguesas</button>
                <button class="bg-white border border-gray-200 text-gray-600 px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap shadow-sm hover:bg-gray-50">Sushi</button>
                <button class="bg-white border border-gray-200 text-gray-600 px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap shadow-sm hover:bg-gray-50">Pollo</button>
            </div>

            <!-- Lista de Catálogo -->
            <div id="menu-list" class="space-y-4"></div>
        </div>
    </div>

    <script>
        const menuDB = [
            { id: 1, restaurante: "Nikkei Village", plato: "Sushi Roll 10pz", precio: 22000, img: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=400&q=80" },
            { id: 2, restaurante: "Frisby", plato: "Combo Frisby", precio: 25000, img: "https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?w=400&q=80" },
            { id: 3, restaurante: "The Corral", plato: "Hamburguesa Todoterreno", precio: 28000, img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400&q=80" }
        ];

        function renderMenu() {
            document.getElementById('menu-list').innerHTML = menuDB.map(item => `
                <div onclick="goToProduct(${item.id})" class="flex items-center gap-4 bg-white p-3 rounded-xl shadow-sm border border-gray-100 cursor-pointer active:scale-95 transition-all">
                    <img src="${item.img}" class="w-20 h-20 object-cover rounded-lg grayscale">
                    <div>
                        <h4 class="font-bold text-gray-800">${item.plato}</h4>
                        <p class="text-xs text-gray-500 font-semibold">${item.restaurante}</p>
                        <p class="text-sm font-black mt-1 text-gray-900">$${item.precio.toLocaleString()}</p>
                    </div>
                </div>
            `).join('');
            updateCartBadge();
        }

        function goToProduct(id) {
            localStorage.setItem('selectedProduct', JSON.stringify(menuDB.find(i => i.id === id)));
            window.location.href = 'producto.html';
        }

        function toggleMenu() {
            document.getElementById('side-menu').classList.toggle('-translate-x-full');
        }

        function toggleMapModal() {
            document.getElementById('map-modal').classList.toggle('hidden');
        }

        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const badge = document.getElementById('cart-badge');
            if(cart.length > 0) { badge.innerText = cart.length; badge.classList.remove('hidden'); }
        }

        renderMenu();
    <script>
        // ... (tus otras funciones de catálogo se mantienen igual) ...

        // Gráfico de Demanda Actual Interactivo y Realista
        const ctx = document.getElementById('congestionChart').getContext('2d');
        
        // Datos por hora en el campus (Eje X) y nivel de congestión de 0 a 100 (Eje Y)
        const horasLabels = ['8am', '9am', '10am', '11am', '12m', '1pm', '2pm', '3pm', '4pm', '5pm', '6pm'];
        const datosDemanda = [15, 25, 45, 65, 95, 100, 80, 50, 30, 20, 10]; 

        // Colores dinámicos: Rojo brillante para horas pico (>80), gris elegante para horas normales
        const backgroundColors = datosDemanda.map(valor => 
            valor > 80 ? 'rgba(220, 38, 38, 0.85)' : 'rgba(209, 213, 219, 0.6)'
        );
        
        const hoverColors = datosDemanda.map(valor => 
            valor > 80 ? 'rgba(185, 28, 28, 1)' : 'rgba(156, 163, 175, 1)'
        );

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: horasLabels,
                datasets: [{
                    data: datosDemanda,
                    backgroundColor: backgroundColors,
                    hoverBackgroundColor: hoverColors,
                    borderRadius: 6,
                    borderSkipped: false,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: {
                    duration: 1200, // Animación suave al cargar la página
                    easing: 'easeOutQuart'
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(17, 24, 39, 0.9)',
                        titleFont: { family: 'Inter', size: 12, weight: 'bold' },
                        bodyFont: { family: 'Inter', size: 12 },
                        padding: 10,
                        cornerRadius: 8,
                        displayColors: false,
                        callbacks: {
                            // Personalizamos el título del globo de información
                            title: function(context) {
                                return `Hora: ${context[0].label}`;
                            },
                            // Personalizamos el texto según el nivel de congestión
                            label: function(context) {
                                const valor = context.parsed.y;
                                if (valor > 80) {
                                    return `🔴 Alta congestión (${valor}% - Plazoletas llenas)`;
                                } else if (valor > 50) {
                                    return `🟡 Demanda moderada (${valor}%)`;
                                } else {
                                    return `🟢 Flujo normal / Baja demanda (${valor}%)`;
                                }
                            }
                        }
                    }
                },
                scales: {
                    y: { 
                        display: false, // Ocultamos el eje Y para mantenerlo minimalista tipo app móvil
                        grid: { display: false }
                    },
                    x: { 
                        grid: { display: false }, 
                        border: { display: false }, 
                        ticks: { 
                            font: { family: 'Inter', size: 10, weight: 'bold' }, 
                            color: '#6B7280' 
                        } 
                    }
                }
            }
        });
    </script>
</body>
</html>
