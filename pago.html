<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout y Entrega - EAFIT Pedidos</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-[#EFEFEF] text-[#222222] font-sans">

  <div class="max-w-md mx-auto bg-white min-h-screen relative shadow-2xl border-x border-gray-200 flex flex-col pb-10">

    <!-- Navbar -->
    <nav class="bg-white p-4 shadow-sm flex items-center justify-between sticky top-0 z-40 border-b border-gray-100">
      <div class="flex items-center gap-3">
        <button onclick="window.location.href='catalogo.html'" class="bg-gray-100 px-3 py-1.5 rounded-full shadow-sm font-bold text-xs active:scale-95">
          ← Seguir comprando
        </button>
        <h1 class="font-black text-base">Tu Carrito</h1>
      </div>
    </nav>

    <div class="p-5 space-y-5">

      <!-- Productos en el Carrito (Carrito Flexible tipo Rappi) -->
      <section class="bg-gray-50 rounded-2xl p-4 border border-gray-200 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-xs font-black uppercase text-gray-500">Resumen del Pedido</h2>
          <span class="text-[10px] font-bold bg-blue-100 text-blue-800 px-2 py-0.5 rounded-md" id="cartCountBadge">0 ítems</span>
        </div>
        
        <!-- Lista de ítems con opción de eliminar -->
        <div id="checkoutItems" class="divide-y divide-gray-200 text-sm"></div>

        <!-- Upsell: Elegir lo último si desea algo más -->
        <div class="mt-3 bg-white p-3 rounded-xl border border-gray-200 flex items-center justify-between shadow-sm">
          <div>
            <p class="text-xs font-black text-gray-900">¿Deseas algo de último minuto?</p>
            <p class="text-[11px] text-gray-500">Agua Brisa 600ml (+ $2.500)</p>
          </div>
          <button onclick="agregarExtra()" class="px-3 py-1.5 bg-gray-900 text-white text-xs font-bold rounded-lg active:scale-95 transition-transform">
            + Sumar
          </button>
        </div>
      </section>

      <!-- 1. Consumir Ya vs Pedido Anticipado -->
      <section class="space-y-2.5">
        <h2 class="text-xs font-black uppercase text-gray-500">1. ¿Cuándo lo quieres?</h2>
        <div class="grid grid-cols-2 gap-2.5">
          <button type="button" id="btnConsumirYa" onclick="setModalidadTiempo('ahora')"
            class="p-3 rounded-xl border-2 border-gray-900 bg-gray-50 text-left transition-all">
            <p class="text-sm font-black text-gray-900">⚡ Consumir ya</p>
            <p class="text-[11px] text-gray-500">Entrega inmediata</p>
          </button>
          <button type="button" id="btnAnticipado" onclick="setModalidadTiempo('anticipado')"
            class="p-3 rounded-xl border border-gray-200 text-left transition-all">
            <p class="text-sm font-black text-gray-900">📅 Anticipado</p>
            <p class="text-[11px] text-gray-500">Reserva tu horario</p>
          </button>
        </div>

        <div id="horarioContainer" class="hidden pt-1 transition-all">
          <label class="block text-xs font-bold text-gray-700 mb-1">Elige la hora exacta (8:00 AM - 8:00 PM):</label>
          <input type="time" id="horarioSelect" min="08:00" max="20:00" 
            class="w-full p-3 text-sm font-bold border border-gray-300 rounded-xl bg-white focus:outline-none focus:border-gray-900" />
          <p class="text-[10px] text-gray-400 mt-1 font-semibold">* Fuera de este horario, los locales del campus estarán cerrados.</p>
        </div>
      </section>

      <!-- 2. Ubicación Libre (Campos de Texto 100% editables) -->
      <section class="space-y-2.5">
        <h2 class="text-xs font-black uppercase text-gray-500">2. Detalles de Entrega</h2>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" id="modo-repartidor" onclick="setModoEntrega('Compañero Repartidor')"
            class="modo-btn p-2.5 rounded-xl border-2 border-gray-900 bg-gray-50 text-[11px] font-black transition-all">
            🏃 Con Repartidor
          </button>
          <button type="button" id="modo-casillero" onclick="setModoEntrega('Casillero Campus')"
            class="modo-btn p-2.5 rounded-xl border border-gray-200 text-[11px] font-black transition-all">
            📦 En Casillero
          </button>
          <button type="button" id="modo-punto" onclick="setModoEntrega('Punto Fijo')"
            class="modo-btn p-2.5 rounded-xl border border-gray-200 text-[11px] font-black transition-all">
            📍 Punto Fijo
          </button>
        </div>

        <div class="grid grid-cols-2 gap-2.5 pt-2">
          <!-- Campo Bloque (Libre con Datalist opcional) -->
          <div>
            <label class="block text-[11px] font-bold text-gray-600 mb-1">Lugar / Bloque</label>
            <input id="inputBloque" type="text" list="listaLugares" placeholder="Ej. Bloque 19" 
              class="w-full p-2.5 text-xs font-bold border border-gray-300 rounded-xl bg-white focus:outline-none focus:border-gray-900" />
            <datalist id="listaLugares">
              <option value="Bloque 19"></option>
              <option value="Bloque 26"></option>
              <option value="Bloque 38"></option>
              <option value="Cafetería Central"></option>
              <option value="Plazoleta del Estudiante"></option>
              <option value="Biblioteca"></option>
            </datalist>
          </div>

          <!-- Campo Piso (Totalmente Libre) -->
          <div>
            <label class="block text-[11px] font-bold text-gray-600 mb-1">Piso / Nivel</label>
            <input id="inputPiso" type="text" placeholder="Ej. Piso 1" 
              class="w-full p-2.5 text-xs font-bold border border-gray-300 rounded-xl bg-white focus:outline-none focus:border-gray-900" />
          </div>
        </div>
        
        <!-- Campo Aula (Totalmente Libre) -->
        <div>
          <label class="block text-[11px] font-bold text-gray-600 mb-1">Aula, Oficina o Instrucciones (Opcional)</label>
          <input id="inputAula" type="text" placeholder="Ej. Aula 304, Casillero #12, Dejar en recepción..." 
            class="w-full p-2.5 text-xs font-semibold border border-gray-300 rounded-xl focus:outline-none focus:border-gray-900" />
        </div>
      </section>

      <!-- 3. Medios de Pago -->
      <section class="space-y-2.5">
        <h2 class="text-xs font-black uppercase text-gray-500">3. Método de Pago</h2>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="setMetodoPago('Saldo Carné')" id="pay-Saldo Carné"
            class="pay-btn p-3 rounded-xl border-2 border-gray-900 bg-gray-50 text-left font-black text-xs transition-all">
            🪪 Saldo Carné
          </button>
          <button type="button" onclick="setMetodoPago('Nequi')" id="pay-Nequi"
            class="pay-btn p-3 rounded-xl border border-gray-200 text-left font-black text-xs transition-all">
            📱 Nequi
          </button>
          <button type="button" onclick="setMetodoPago('Tarjetas')" id="pay-Tarjetas"
            class="pay-btn p-3 rounded-xl border border-gray-200 text-left font-black text-xs transition-all">
            💳 Tarjetas
          </button>
          <button type="button" onclick="setMetodoPago('Pago en Punto')" id="pay-Pago en Punto"
            class="pay-btn p-3 rounded-xl border border-gray-200 text-left font-black text-xs transition-all">
            💵 Efectivo en Punto
          </button>
        </div>
      </section>

      <button onclick="generarOrdenPedido()" 
        class="w-full bg-gray-900 text-white font-black py-4 rounded-xl hover:bg-gray-800 active:scale-95 transition-transform shadow-md text-sm sticky bottom-4">
        CONFIRMAR Y PAGAR (<span id="btnTotalText">$0</span>)
      </button>

    </div>
  </div>

  <script>
    let modalidadTiempo = 'ahora';
    let modoEntrega = 'Compañero Repartidor';
    let metodoPago = 'Saldo Carné';

    function obtenerCarritoUnificado() {
      const cNuevo = JSON.parse(localStorage.getItem('eafit_cart') || '[]');
      const cViejo = JSON.parse(localStorage.getItem('cart') || '[]');
      if (cViejo.length > 0) {
        cViejo.forEach(p => {
          cNuevo.push({
            storeId: 'store-prod',
            storeName: p.restaurante || 'Restaurante EAFIT',
            storeType: p.storeType || 'restaurante',
            prodId: 'prod-' + Date.now() + Math.random(),
            prodName: p.plato,
            precio: Number(p.precio),
            cantidad: 1
          });
        });
        localStorage.removeItem('cart');
        localStorage.setItem('eafit_cart', JSON.stringify(cNuevo));
      }
      return cNuevo;
    }

    function renderizarResumen() {
      const cart = obtenerCarritoUnificado();
      const cont = document.getElementById('checkoutItems');
      const badge = document.getElementById('cartCountBadge');
      
      const totalItems = cart.reduce((acc, i) => acc + i.cantidad, 0);
      badge.textContent = `${totalItems} ítem${totalItems !== 1 ? 's' : ''}`;

      if (cart.length === 0) {
        cont.innerHTML = `
          <div class="py-6 text-center">
            <span class="text-3xl block mb-2">🛒</span>
            <p class="text-gray-500 text-xs font-semibold">Tu carrito está vacío.</p>
            <a href="catalogo.html" class="text-gray-900 underline font-black text-xs mt-1 block">Volver a explorar</a>
          </div>`;
        document.getElementById('btnTotalText').textContent = '$0';
        return;
      }

      let total = 0;
      cont.innerHTML = cart.map(item => {
        const sub = item.precio * item.cantidad;
        total += sub;
        return `
          <div class="py-3 flex justify-between items-center group">
            <div class="flex-1">
              <p class="font-bold text-gray-900 text-xs">${item.cantidad}x ${item.prodName}</p>
              <p class="text-[11px] text-gray-500">${item.storeName}</p>
            </div>
            <div class="flex items-center gap-3">
              <span class="font-black text-gray-900 text-xs">$${sub.toLocaleString('es-CO')}</span>
              <button onclick="eliminarItemCarrito('${item.prodId}')" 
                class="text-gray-400 hover:text-red-500 active:scale-95 transition-colors p-1" 
                title="Eliminar plato">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
      document.getElementById('btnTotalText').textContent = '$' + total.toLocaleString('es-CO');
    }

    function eliminarItemCarrito(prodId) {
      let cart = obtenerCarritoUnificado();
      cart = cart.filter(item => item.prodId !== prodId);
      localStorage.setItem('eafit_cart', JSON.stringify(cart));
      renderizarResumen();
    }

    function agregarExtra() {
      const cart = obtenerCarritoUnificado();
      cart.push({
        storeId: 'store-extra',
        storeName: 'Adición Último Minuto',
        storeType: 'restaurante',
        prodId: 'extra-agua-' + Date.now(),
        prodName: 'Agua Brisa 600ml',
        precio: 2500,
        cantidad: 1
      });
      localStorage.setItem('eafit_cart', JSON.stringify(cart));
      renderizarResumen();
    }

    function setModalidadTiempo(mod) {
      modalidadTiempo = mod;
      document.getElementById('btnConsumirYa').className = mod === 'ahora'
        ? 'p-3 rounded-xl border-2 border-gray-900 bg-gray-50 text-left transition-all'
        : 'p-3 rounded-xl border border-gray-200 text-left transition-all';
      document.getElementById('btnAnticipado').className = mod === 'anticipado'
        ? 'p-3 rounded-xl border-2 border-gray-900 bg-gray-50 text-left transition-all'
        : 'p-3 rounded-xl border border-gray-200 text-left transition-all';
      
      const container = document.getElementById('horarioContainer');
      if (mod === 'anticipado') {
        container.classList.remove('hidden');
      } else {
        container.classList.add('hidden');
      }
    }

    function setModoEntrega(modo) {
      modoEntrega = modo;
      document.querySelectorAll('.modo-btn').forEach(b => {
        b.className = 'modo-btn p-2.5 rounded-xl border border-gray-200 text-[11px] font-black transition-all';
      });
      if (modo.includes('Repartidor')) document.getElementById('modo-repartidor').className = 'modo-btn p-2.5 rounded-xl border-2 border-gray-900 bg-gray-50 text-[11px] font-black transition-all';
      if (modo.includes('Casillero')) document.getElementById('modo-casillero').className = 'modo-btn p-2.5 rounded-xl border-2 border-gray-900 bg-gray-50 text-[11px] font-black transition-all';
      if (modo.includes('Punto')) document.getElementById('modo-punto').className = 'modo-btn p-2.5 rounded-xl border-2 border-gray-900 bg-gray-50 text-[11px] font-black transition-all';
    }

    function setMetodoPago(metodo) {
      metodoPago = metodo;
      document.querySelectorAll('.pay-btn').forEach(b => {
        b.className = 'pay-btn p-3 rounded-xl border border-gray-200 text-left font-black text-xs transition-all';
      });
      document.getElementById('pay-' + metodo).className = 'pay-btn p-3 rounded-xl border-2 border-gray-900 bg-gray-50 text-left font-black text-xs transition-all';
    }

    // Formatear hora de 24h a 12h AM/PM
    function formatearHora(timeVal) {
      const [hours, minutes] = timeVal.split(':');
      const h = parseInt(hours, 10);
      const ampm = h >= 12 ? 'PM' : 'AM';
      const h12 = h % 12 || 12;
      return `${h12}:${minutes} ${ampm}`;
    }

    function generarOrdenPedido() {
      const cart = obtenerCarritoUnificado();
      if (cart.length === 0) return alert('No hay productos en tu carrito para pagar.');

      // Validar horario si es anticipado
      let horario = 'Inmediato (Consumir ya)';
      if (modalidadTiempo === 'anticipado') {
        const timeInput = document.getElementById('horarioSelect').value;
        if (!timeInput) return alert('Por favor, selecciona a qué hora deseas tu pedido.');
        
        // Validar rango de 8 AM a 8 PM
        const [h, m] = timeInput.split(':').map(Number);
        if (h < 8 || h >= 20) {
          return alert('El horario de atención es de 8:00 AM a 8:00 PM. Por favor selecciona una hora válida.');
        }
        horario = formatearHora(timeInput) + ' (Programado)';
      }

      // Validar ubicación
      const valBloque = document.getElementById('inputBloque').value.trim() || 'Bloque a convenir';
      const valPiso = document.getElementById('inputPiso').value.trim() || 'Piso a convenir';
      const valAula = document.getElementById('inputAula').value.trim() || 'A convenir';

      const pinAleatorio = Math.floor(1000 + Math.random() * 9000).toString();
      const total = cart.reduce((acc, i) => acc + (i.precio * i.cantidad), 0);
      const tieneEmprendimiento = cart.some(i => i.storeType === 'emprendimiento');

      const nuevaOrden = {
        id: 'ORD-' + Math.floor(100 + Math.random() * 900),
        fecha: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        comprador: localStorage.getItem('eafit_user_email') || 'estudiante@eafit.edu.co',
        items: cart,
        total,
        modalidadTiempo,
        horario,
        modoEntrega,
        ubicacion: {
          bloque: valBloque,
          piso: valPiso,
          aula: valAula,
          direccionCompleta: `${valBloque} · ${valPiso} · ${valAula}`
        },
        metodoPago,
        estado: 'Recibido',
        estadoEmprendedor: 'Alerta de nuevo pedido pagado',
        esEmprendimiento: tieneEmprendimiento,
        alertaLlegada: false,
        pin: pinAleatorio
      };

      const ordenes = JSON.parse(localStorage.getItem('eafit_orders') || '[]');
      ordenes.unshift(nuevaOrden);
      localStorage.setItem('eafit_orders', JSON.stringify(ordenes));
      localStorage.setItem('eafit_active_order_id', nuevaOrden.id);
      
      // Limpiar carritos
      localStorage.removeItem('eafit_cart');
      localStorage.removeItem('cart');

      window.location.href = 'seguimiento.html';
    }

    renderizarResumen();
  </script>
</body>
</html>
