<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturación</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#EFEFEF] text-[#222222] font-sans min-h-screen flex flex-col">

    <nav class="bg-white p-4 shadow-sm flex items-center gap-4">
        <button onclick="window.location.href='catalogo.html'" class="font-bold text-lg">← Catálogo</button>
        <h1 class="font-bold text-lg">Facturación</h1>
    </nav>

    <div class="p-4 max-w-xl mx-auto w-full space-y-4 flex-1">
        <div class="bg-white p-4 rounded-lg shadow-sm">
            <h3 class="font-bold mb-3 border-b pb-2">Resumen</h3>
            <div id="cart-list" class="space-y-2 text-sm mb-4"></div>
            <div class="flex justify-between font-bold text-lg border-t pt-2">
                <span>Total:</span> <span id="total-val">$0</span>
            </div>
        </div>

        <div class="bg-white p-4 rounded-lg shadow-sm space-y-3">
            <label class="block text-sm font-bold text-gray-700">Método de Pago</label>
            <select class="w-full border p-2 rounded bg-gray-50 text-sm">
                <option>Descuento Nómina / Carné</option>
                <option>Tarjeta Crédito / PSE</option>
            </select>

            <label class="block text-sm font-bold text-gray-700 mt-2">Hora de recogida</label>
            <input type="time" id="time-input" class="w-full border p-2 rounded bg-gray-50 text-sm" value="12:30">
        </div>
    </div>

    <div class="bg-white p-4 border-t">
        <button id="btn-pagar" onclick="submitOrder()" class="w-full max-w-xl mx-auto block bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700">
            CONFIRMAR Y PAGAR
        </button>
    </div>

    <script>
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        if(cart.length === 0) window.location.href = 'catalogo.html';

        let total = 1500; // Tarifa base
        document.getElementById('cart-list').innerHTML = cart.map(item => {
            total += item.precio;
            return `<div class="flex justify-between text-gray-600"><span>1x ${item.plato}</span><span>$${item.precio.toLocaleString()}</span></div>`;
        }).join('');
        document.getElementById('total-val').innerText = `$${total.toLocaleString()}`;

        async function submitOrder() {
            const btn = document.getElementById('btn-pagar');
            btn.innerText = "Procesando..."; btn.disabled = true;

            const orderData = {
                id: Math.floor(Math.random() * 1000) + 100, // ID Aleatorio
                items: cart.map(i => i.plato).join(', '),
                time: document.getElementById('time-input').value,
                total: total,
                status: 'pendiente'
            };

            try {
                // AQUÍ SE CONECTA AL BACKEND DE RENDER
                const response = await fetch('https://eafit-pedidos-mvp-html.onrender.com/nuevo-pedido', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                if (response.ok) {
                    localStorage.setItem('currentOrder', JSON.stringify(orderData));
                    localStorage.removeItem('cart'); // Vaciar carrito
                    window.location.href = 'seguimiento.html';
                } else {
                    alert("Error en el restaurante.");
                }
            } catch (error) {
                alert("Error de conexión con Render.");
            } finally {
                btn.innerText = "CONFIRMAR Y PAGAR"; btn.disabled = false;
            }
        }
    </script>
</body>
</html>
