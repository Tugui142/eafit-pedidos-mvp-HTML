<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout y Entrega - EAFIT Pedidos</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-[#EFEFEF] text-[#222222] font-sans">

  <div class="max-w-md mx-auto bg-white min-h-screen relative shadow-2xl border-x border-gray-200 flex flex-col pb-10">

    <!-- Navbar -->
    <nav class="bg-white p-4 shadow-sm flex items-center justify-between sticky top-0 z-40 border-b border-gray-100">
      <div class="flex items-center gap-3">
        <button onclick="window.location.href='catalogo.html'" class="bg-gray-100 px-3 py-1.5 rounded-full shadow-sm font-bold text-xs active:scale-95">
          ← Seguir comprando
        </button>
        <h1 class="font-black text-base">Tu Carrito y Entrega</h1>
      </div>
    </nav>

    <div class="p-5 space-y-5">

      <!-- Productos en el Carrito Acumulativo -->
      <section class="bg-gray-50 rounded-2xl p-4 border border-gray-200">
        <h2 class="text-xs font-black uppercase text-gray-500 mb-2">Productos Acumulados</h2>
        <div id="checkoutItems" class="divide-y divide-gray-200 text-sm"></div>

        <!-- Elegir lo último si desea algo más -->
        <div class="mt-3 bg-white p-3 rounded-xl border border-gray-200 flex items-center justify-between">
          <div>
            <p class="text-xs font-black text-gray-900">¿Deseas algo más de último minuto?</p>
            <p class="text-[11px] text-gray-500">Agua Brisa 600ml o galleta (+ $2.500)</p>
          </div>
          <button onclick="agregarExtra()" class="px-3 py-1.5 bg-gray-900 text-white text-xs font-bold rounded-lg">
            + Sumar
          </button>
        </div>
      </section>

      <!-- 1. Consumir Ya vs Pedido Anticipado -->
      <section class="space-y-2.5">
        <h2 class="text-xs font-black uppercase text-gray-500">1. ¿Cuándo deseas tu pedido?</h2>
        <div class="grid grid-cols-2 gap-2.5">
          <button type="button" id="btnConsumirYa" onclick="setModalidadTiempo('ahora')"
            class="p-3 rounded-xl border-2 border-gray-900 bg-gray-50 text-left">
            <p class="text-sm font-black text-gray-900">⚡ Consumir ya</p>
            <p class="text-[11px] text-gray-500">Entrega inmediata</p>
          </button>
          <button type="button" id="btnAnticipado" onclick="setModalidadTiempo('anticipado')"
            class="p-3 rounded-xl border border-gray-200 text-left">
            <p class="text-sm font-black text-gray-900">📅 Anticipado</p>
            <p class="text-[11px] text-gray-500">Reserva tu horario</p>
          </button>
        </div>

        <div id="horarioContainer" class="hidden pt-1">
          <label class="block text-xs font-bold text-gray-700 mb-1">Horario programado de recogida/entrega:</label>
          <select id="horarioSelect" class="w-full p-3 text-sm font-semibold border border-gray-300 rounded-xl bg-white">
            <option value="12:00 PM - 12:15 PM">12:00 PM - 12:15 PM</option>
            <option value="12:30 PM - 12:45 PM">12:30 PM - 12:45 PM</option>
            <option value="01:00 PM - 01:15 PM">01:00 PM - 01:15 PM</option>
            <option value="02:00 PM - 02:15 PM">02:00 PM - 02:15 PM</option>
          </select>
        </div>
      </section>

      <!-- 2. Ubicación Estructurada (Bloque + Piso + Aula / Casillero) -->
      <section class="space-y-2.5">
        <h2 class="text-xs font-black uppercase text-gray-500">2. Ubicación Exacta o Casillero</h2>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" id="modo-repartidor" onclick="setModoEntrega('Compañero Repartidor')"
            class="modo-btn p-2.5 rounded-xl border-2 border-gray-900 bg-gray-50 text-[11px] font-black">
            🏃 Con Repartidor
          </button>
          <button type="button" id="modo-casillero" onclick="setModoEntrega('Casillero Campus')"
            class="modo-btn p-2.5 rounded-xl border border-gray-200 text-[11px] font-black">
            📦 En Casillero
          </button>
          <button type="button" id="modo-punto" onclick="setModoEntrega('Punto Fijo')"
            class="modo-btn p-2.5 rounded-xl border border-gray-200 text-[11px] font-black">
            📍 Punto Fijo
          </button>
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-[11px] font-bold text-gray-600 mb-1">Bloque</label>
            <select id="inputBloque" class="w-full p-2.5 text-xs font-bold border border-gray-300 rounded-xl bg-white">
              <option value="Bloque 38">Bloque 38</option>
              <option value="Bloque 26">Bloque 26</option>
              <option value="Bloque 19">Bloque 19</option>
              <option value="Bloque 32 (Biblioteca)">Bloque 32</option>
              <option value="Casilleros Bloque 29">Casilleros B29</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-gray-600 mb-1">Piso</label>
            <select id="inputPiso" class="w-full p-2.5 text-xs font-bold border border-gray-300 rounded-xl bg-white">
              <option value="Piso 1">Piso 1</option>
              <option value="Piso 2">Piso 2</option>
              <option value="Piso 3">Piso 3</option>
              <option value="Piso 4">Piso 4</option>
              <option value="Casillero #14">Casillero #14</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-[11px] font-bold text-gray-600 mb-1">Aula o Punto de Encuentro</label>
          <input id="inputAula" type="text" value="Aula 304 / Entrada" 
            class="w-full p-2.5 text-xs font-semibold border border-gray-300 rounded-xl" />
        </div>
      </section>

      <!-- 3. Medios de Pago -->
      <section class="space-y-2.5">
        <h2 class="text-xs font-black uppercase text-gray-500">3. Medio de Pago</h2>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="setMetodoPago('Saldo Carné')" id="pay-Saldo Carné"
            class="pay-btn p-3 rounded-xl border-2 border-gray-900 bg-gray-50 text-left font-black text-xs">
            🪪 Saldo Carné EAFIT
          </button>
          <button type="button" onclick="setMetodoPago('Nequi')" id="pay-Nequi"
            class="pay-btn p-3 rounded-xl border border-gray-200 text-left font-black text-xs">
            📱 Nequi
          </button>
          <button type="button" onclick="setMetodoPago('Tarjetas')" id="pay-Tarjetas"
            class="pay-btn p-3 rounded-xl border border-gray-200 text-left font-black text-xs">
            💳 Tarjetas
          </button>
          <button type="button" onclick="setMetodoPago('Pago en Punto')" id="pay-Pago en Punto"
            class="pay-btn p-3 rounded-xl border border-gray-200 text-left font-black text-xs">
            💵 En el Punto
          </button>
        </div>
      </section>

      <button onclick="generarOrdenPedido()" 
        class="w-full bg-gray-900 text-white font-black py-4 rounded-xl hover:bg-gray-800 active:scale-95 transition-transform shadow-md text-sm">
        CONFIRMAR Y PAGAR (<span id="btnTotalText">$0</span>)
      </button>

    </div>
  </div>

  <script>
    let modalidadTiempo = 'ahora';
    let modoEntrega = 'Compañero Repartidor';
    let metodoPago = 'Saldo Carné';

    function obtenerCarritoUnificado() {
      const cNuevo = JSON.parse(localStorage.getItem('eafit_cart') || '[]');
      const cViejo = JSON.parse(localStorage.getItem('cart') || '[]');
      if (cViejo.length > 0) {
        cViejo.forEach(p => {
          cNuevo.push({
            storeId: 'store-prod',
            storeName: p.restaurante || 'Restaurante EAFIT',
            storeType: p.storeType || 'restaurante',
            prodId: 'prod-' + Date.now() + Math.random(),
            prodName: p.plato,
            precio: Number(p.precio),
            cantidad: 1
          });
        });
        localStorage.removeItem('cart');
        localStorage.setItem('eafit_cart', JSON.stringify(cNuevo));
      }
      return cNuevo;
    }

    function renderizarResumen() {
      const cart = obtenerCarritoUnificado();
      const cont = document.getElementById('checkoutItems');
      if (cart.length === 0) {
        cont.innerHTML = `<p class="text-gray-500 py-3 text-xs">Carrito vacío. <a href="catalogo.html" class="underline font-bold">Ir al catálogo</a></p>`;
        document.getElementById('btnTotalText').textContent = '$0';
        return;
      }
      let total = 0;
      cont.innerHTML = cart.map(item => {
        const sub = item.precio * item.cantidad;
        total += sub;
        return `
          <div class="py-2.5 flex justify-between items-center">
            <div>
              <p class="font-bold text-gray-900 text-xs">${item.cantidad}x ${item.prodName}</p>
              <p class="text-[11px] text-gray-500">${item.storeName}</p>
            </div>
            <span class="font-black text-gray-900 text-xs">$${sub.toLocaleString('es-CO')}</span>
          </div>
        `;
      }).join('');
      document.getElementById('btnTotalText').textContent = '$' + total.toLocaleString('es-CO');
    }

    function agregarExtra() {
      const cart = obtenerCarritoUnificado();
      cart.push({
        storeId: 'store-extra',
        storeName: 'Adición Último Minuto',
        storeType: 'restaurante',
        prodId: 'extra-agua',
        prodName: 'Agua Brisa 600ml',
        precio: 2500,
        cantidad: 1
      });
      localStorage.setItem('eafit_cart', JSON.stringify(cart));
      renderizarResumen();
    }

    function setModalidadTiempo(mod) {
      modalidadTiempo = mod;
      document.getElementById('btnConsumirYa').className = mod === 'ahora'
        ? 'p-3 rounded-xl border-2 border-gray-900 bg-gray-50 text-left'
        : 'p-3 rounded-xl border border-gray-200 text-left';
      document.getElementById('btnAnticipado').className = mod === 'anticipado'
        ? 'p-3 rounded-xl border-2 border-gray-900 bg-gray-50 text-left'
        : 'p-3 rounded-xl border border-gray-200 text-left';
      document.getElementById('horarioContainer').classList.toggle('hidden', mod !== 'anticipado');
    }

    function setModoEntrega(modo) {
      modoEntrega = modo;
      document.querySelectorAll('.modo-btn').forEach(b => {
        b.className = 'modo-btn p-2.5 rounded-xl border border-gray-200 text-[11px] font-black';
      });
      if (modo.includes('Repartidor')) document.getElementById('modo-repartidor').className = 'modo-btn p-2.5 rounded-xl border-2 border-gray-900 bg-gray-50 text-[11px] font-black';
      if (modo.includes('Casillero')) document.getElementById('modo-casillero').className = 'modo-btn p-2.5 rounded-xl border-2 border-gray-900 bg-gray-50 text-[11px] font-black';
      if (modo.includes('Punto')) document.getElementById('modo-punto').className = 'modo-btn p-2.5 rounded-xl border-2 border-gray-900 bg-gray-50 text-[11px] font-black';
    }

    function setMetodoPago(metodo) {
      metodoPago = metodo;
      document.querySelectorAll('.pay-btn').forEach(b => {
        b.className = 'pay-btn p-3 rounded-xl border border-gray-200 text-left font-black text-xs';
      });
      document.getElementById('pay-' + metodo).className = 'pay-btn p-3 rounded-xl border-2 border-gray-900 bg-gray-50 text-left font-black text-xs';
    }

    function generarOrdenPedido() {
      const cart = obtenerCarritoUnificado();
      if (cart.length === 0) return alert('Tu carrito está vacío.');

      const pinAleatorio = Math.floor(1000 + Math.random() * 9000).toString();
      const bloque = document.getElementById('inputBloque').value;
      const piso = document.getElementById('inputPiso').value;
      const aula = document.getElementById('inputAula').value;
      const horario = modalidadTiempo === 'anticipado'
        ? document.getElementById('horarioSelect').value
        : 'Inmediato (Consumir ya)';

      const total = cart.reduce((acc, i) => acc + (i.precio * i.cantidad), 0);
      const tieneEmprendimiento = cart.some(i => i.storeType === 'emprendimiento');

      const nuevaOrden = {
        id: 'ORD-' + Math.floor(100 + Math.random() * 900),
        fecha: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        comprador: localStorage.getItem('eafit_user_email') || 'estudiante@eafit.edu.co',
        items: cart,
        total,
        modalidadTiempo,
        horario,
        modoEntrega,
        ubicacion: {
          bloque,
          piso,
          aula,
          direccionCompleta: `${bloque} · ${piso} · ${aula}`
        },
        metodoPago,
        estado: 'Recibido',
        estadoEmprendedor: 'Alerta de nuevo pedido pagado',
        esEmprendimiento: tieneEmprendimiento,
        alertaLlegada: false,
        pin: pinAleatorio
      };

      const ordenes = JSON.parse(localStorage.getItem('eafit_orders') || '[]');
      ordenes.unshift(nuevaOrden);
      localStorage.setItem('eafit_orders', JSON.stringify(ordenes));
      localStorage.setItem('eafit_active_order_id', nuevaOrden.id);
      localStorage.removeItem('eafit_cart');
      localStorage.removeItem('cart');

      window.location.href = 'seguimiento.html';
    }

    renderizarResumen();
  </script>
</body>
</html>
