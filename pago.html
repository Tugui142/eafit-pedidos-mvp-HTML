<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout y Entrega - EAFIT Pedidos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="pb-12">

  <header class="bg-eafit-oscuro text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="catalogo.html" class="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center hover:bg-white/20">
          <i class="fa-solid fa-arrow-left text-sm"></i>
        </a>
        <h1 class="font-bold text-base">Confirmar Pedido y Entrega</h1>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 pt-5 space-y-5">

    <!-- Resumen del Carrito + "Elegir lo último" -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
      <h2 class="text-sm font-bold text-slate-800 mb-3 flex items-center gap-2">
        <i class="fa-solid fa-basket-shopping text-blue-900"></i> Tus Productos Seleccionados
      </h2>
      <div id="checkoutItems" class="divide-y divide-slate-100 text-sm"></div>

      <!-- Upsell: Elegir lo último si desea algo más -->
      <div class="mt-4 bg-blue-50/70 p-3 rounded-xl border border-blue-200 flex items-center justify-between">
        <div>
          <p class="text-xs font-bold text-blue-950">¿Deseas algo más de último minuto?</p>
          <p class="text-[11px] text-slate-600">Agua Cristal 600ml o Servilletas Extra (+ $2.500)</p>
        </div>
        <button onclick="agregarExtra()" class="px-3 py-1.5 bg-blue-900 text-white text-xs font-bold rounded-lg hover:bg-blue-800">
          + Sumar Agua ($2.500)
        </button>
      </div>
    </section>

    <!-- 1. Modalidad de Tiempo: Consumir Ya vs Pedido Anticipado -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
      <h2 class="text-sm font-bold text-slate-800">1. ¿Cuándo deseas tu pedido?</h2>
      <div class="grid grid-cols-2 gap-3">
        <button type="button" id="btnConsumirYa" onclick="setModalidadTiempo('ahora')"
          class="p-3 rounded-xl border-2 border-blue-900 bg-blue-50/40 text-left">
          <p class="text-sm font-bold text-slate-900"><i class="fa-solid fa-bolt text-amber-500"></i> Consumir ya</p>
          <p class="text-xs text-slate-500">Preparación y despacho inmediato</p>
        </button>
        <button type="button" id="btnAnticipado" onclick="setModalidadTiempo('anticipado')"
          class="p-3 rounded-xl border border-slate-200 text-left">
          <p class="text-sm font-bold text-slate-900"><i class="fa-regular fa-calendar-check text-blue-900"></i> Pedido anticipado</p>
          <p class="text-xs text-slate-500">Reserva recogida/entrega en tu horario</p>
        </button>
      </div>

      <!-- Selector de horario (visible si es Pedido Anticipado) -->
      <div id="horarioContainer" class="hidden pt-2">
        <label class="block text-xs font-bold text-slate-600 mb-1">Selecciona horario de recogida o entrega:</label>
        <select id="horarioSelect" class="w-full p-2.5 text-sm border border-slate-300 rounded-xl bg-white">
          <option value="12:00 PM - 12:15 PM">12:00 PM - 12:15 PM (Cambio de clase)</option>
          <option value="12:30 PM - 12:45 PM">12:30 PM - 12:45 PM</option>
          <option value="01:00 PM - 01:15 PM">01:00 PM - 01:15 PM</option>
          <option value="02:00 PM - 02:15 PM">02:00 PM - 02:15 PM</option>
          <option value="04:00 PM - 04:15 PM">04:00 PM - 04:15 PM</option>
        </select>
      </div>
    </section>

    <!-- 2. Ubicación Estructurada (Bloque + Piso + Aula / Punto de encuentro / Casillero) -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
      <h2 class="text-sm font-bold text-slate-800">2. Modalidad y Ubicación de Entrega en el Campus</h2>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
        <button type="button" id="modo-repartidor" onclick="setModoEntrega('Compañero Repartidor')"
          class="modo-btn p-2.5 rounded-xl border-2 border-blue-900 bg-blue-50/40 text-xs font-bold text-slate-800">
          <i class="fa-solid fa-person-walking"></i> Enviar con Repartidor
        </button>
        <button type="button" id="modo-casillero" onclick="setModoEntrega('Casillero Inteligente')"
          class="modo-btn p-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-800">
          <i class="fa-solid fa-boxes-stacked"></i> Casillero Campus
        </button>
        <button type="button" id="modo-punto" onclick="setModoEntrega('Punto Fijo / Recogida')"
          class="modo-btn p-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-800">
          <i class="fa-solid fa-location-dot"></i> Recoger en Punto Fijo
        </button>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-1">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Bloque / Zona</label>
          <select id="inputBloque" class="w-full p-2.5 text-sm border border-slate-300 rounded-xl bg-white">
            <option value="Bloque 38">Bloque 38 (I+D / Diseño)</option>
            <option value="Bloque 26">Bloque 26 (Ingeniería)</option>
            <option value="Bloque 19">Bloque 19 (Aulas)</option>
            <option value="Bloque 32">Bloque 32 (Biblioteca)</option>
            <option value="Casilleros Bloque 29">Casilleros Bloque 29</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Piso / Nivel</label>
          <select id="inputPiso" class="w-full p-2.5 text-sm border border-slate-300 rounded-xl bg-white">
            <option value="Piso 1">Piso 1 (Hall / Entrada)</option>
            <option value="Piso 2">Piso 2</option>
            <option value="Piso 3">Piso 3</option>
            <option value="Piso 4">Piso 4</option>
            <option value="Casillero #14">Casillero #14</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Aula o Punto de Encuentro</label>
          <input id="inputAula" type="text" value="Aula 304 / Bancas entrada" 
            class="w-full p-2.5 text-sm border border-slate-300 rounded-xl" placeholder="Ej. Aula 201 o Casillero 12" />
        </div>
      </div>
    </section>

    <!-- 3. Método de Pago -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
      <h2 class="text-sm font-bold text-slate-800">3. Medio de Pago</h2>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
        <button type="button" onclick="setMetodoPago('Nequi')" id="pay-Nequi"
          class="pay-btn p-3 rounded-xl border-2 border-blue-900 bg-blue-50/40 text-center">
          <i class="fa-solid fa-mobile-screen-button text-pink-600 text-lg"></i>
          <p class="text-xs font-bold mt-1">Nequi</p>
        </button>
        <button type="button" onclick="setMetodoPago('Tarjetas')" id="pay-Tarjetas"
          class="pay-btn p-3 rounded-xl border border-slate-200 text-center">
          <i class="fa-regular fa-credit-card text-blue-700 text-lg"></i>
          <p class="text-xs font-bold mt-1">Tarjetas</p>
        </button>
        <button type="button" onclick="setMetodoPago('Saldo Carné')" id="pay-Saldo Carné"
          class="pay-btn p-3 rounded-xl border border-slate-200 text-center">
          <i class="fa-solid fa-id-card text-emerald-700 text-lg"></i>
          <p class="text-xs font-bold mt-1">Saldo Carné</p>
        </button>
        <button type="button" onclick="setMetodoPago('Pago en Punto')" id="pay-Pago en Punto"
          class="pay-btn p-3 rounded-xl border border-slate-200 text-center">
          <i class="fa-solid fa-hand-holding-dollar text-amber-600 text-lg"></i>
          <p class="text-xs font-bold mt-1">En el Punto</p>
        </button>
      </div>
    </section>

    <!-- Botón Generar Orden -->
    <button onclick="generarOrdenPedido()" 
      class="w-full py-3.5 bg-eafit-oscuro hover:bg-blue-900 text-white font-bold rounded-2xl shadow-lg text-base flex items-center justify-center gap-2 transition">
      <i class="fa-solid fa-lock"></i> Confirmar y Pagar Pedido (<span id="btnTotalText">$0</span>)
    </button>

  </main>

  <script>
    let modalidadTiempo = 'ahora';
    let modoEntrega = 'Compañero Repartidor';
    let metodoPago = 'Nequi';

    function obtenerCarrito() {
      return JSON.parse(localStorage.getItem('eafit_cart') || '[]');
    }

    function renderizarResumen() {
      const cart = obtenerCarrito();
      const cont = document.getElementById('checkoutItems');
      if (cart.length === 0) {
        cont.innerHTML = `<p class="text-slate-500 py-3">Tu carrito está vacío. <a href="catalogo.html" class="text-blue-900 underline font-bold">Volver al catálogo</a></p>`;
        document.getElementById('btnTotalText').textContent = '$0';
        return;
      }
      let total = 0;
      cont.innerHTML = cart.map(item => {
        const sub = item.precio * item.cantidad;
        total += sub;
        return `
          <div class="py-2 flex justify-between items-center">
            <div>
              <p class="font-semibold text-slate-800">${item.cantidad}x ${item.prodName}</p>
              <p class="text-xs text-slate-500">${item.storeName}</p>
            </div>
            <span class="font-bold text-slate-800">$${sub.toLocaleString('es-CO')}</span>
          </div>
        `;
      }).join('');
      document.getElementById('btnTotalText').textContent = '$' + total.toLocaleString('es-CO');
    }

    function agregarExtra() {
      const cart = obtenerCarrito();
      cart.push({
        storeId: 'store-extra',
        storeName: 'Adición Rápida',
        storeType: 'restaurante',
        prodId: 'extra-agua',
        prodName: 'Agua Cristal 600ml',
        precio: 2500,
        cantidad: 1
      });
      localStorage.setItem('eafit_cart', JSON.stringify(cart));
      renderizarResumen();
    }

    function setModalidadTiempo(mod) {
      modalidadTiempo = mod;
      document.getElementById('btnConsumirYa').className = mod === 'ahora'
        ? 'p-3 rounded-xl border-2 border-blue-900 bg-blue-50/40 text-left'
        : 'p-3 rounded-xl border border-slate-200 text-left';
      document.getElementById('btnAnticipado').className = mod === 'anticipado'
        ? 'p-3 rounded-xl border-2 border-blue-900 bg-blue-50/40 text-left'
        : 'p-3 rounded-xl border border-slate-200 text-left';
      document.getElementById('horarioContainer').classList.toggle('hidden', mod !== 'anticipado');
    }

    function setModoEntrega(modo) {
      modoEntrega = modo;
      document.querySelectorAll('.modo-btn').forEach(b => {
        b.className = 'modo-btn p-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-800';
      });
      if (modo.includes('Repartidor')) document.getElementById('modo-repartidor').className = 'modo-btn p-2.5 rounded-xl border-2 border-blue-900 bg-blue-50/40 text-xs font-bold text-slate-800';
      if (modo.includes('Casillero')) document.getElementById('modo-casillero').className = 'modo-btn p-2.5 rounded-xl border-2 border-blue-900 bg-blue-50/40 text-xs font-bold text-slate-800';
      if (modo.includes('Punto')) document.getElementById('modo-punto').className = 'modo-btn p-2.5 rounded-xl border-2 border-blue-900 bg-blue-50/40 text-xs font-bold text-slate-800';
    }

    function setMetodoPago(metodo) {
      metodoPago = metodo;
      document.querySelectorAll('.pay-btn').forEach(b => {
        b.className = 'pay-btn p-3 rounded-xl border border-slate-200 text-center';
      });
      document.getElementById('pay-' + metodo).className = 'pay-btn p-3 rounded-xl border-2 border-blue-900 bg-blue-50/40 text-center';
    }

    function generarOrdenPedido() {
      const cart = obtenerCarrito();
      if (cart.length === 0) return alert('Agrega al menos un producto antes de continuar.');

      const pinAleatorio = Math.floor(1000 + Math.random() * 9000).toString();
      const bloque = document.getElementById('inputBloque').value;
      const piso = document.getElementById('inputPiso').value;
      const aula = document.getElementById('inputAula').value;
      const horario = modalidadTiempo === 'anticipado'
        ? document.getElementById('horarioSelect').value
        : 'Inmediato (Consumir ya)';

      const total = cart.reduce((acc, i) => acc + (i.precio * i.cantidad), 0);
      const tieneEmprendimiento = cart.some(i => i.storeType === 'emprendimiento');

      const nuevaOrden = {
        id: 'ORD-' + Math.floor(100 + Math.random() * 900),
        fecha: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        comprador: localStorage.getItem('eafit_user_email') || 'estudiante@eafit.edu.co',
        items: cart,
        total,
        modalidadTiempo,
        horario,
        modoEntrega,
        ubicacion: {
          bloque,
          piso,
          aula,
          direccionCompleta: `${bloque} · ${piso} · ${aula}`
        },
        metodoPago,
        estado: 'Recibido', // Estados: Recibido -> En cocina -> Buscando repartidor -> En camino -> Entregado
        estadoEmprendedor: 'Alerta de nuevo pedido pagado',
        esEmprendimiento: tieneEmprendimiento,
        alertaLlegada: false,
        pin: pinAleatorio
      };

      const ordenes = JSON.parse(localStorage.getItem('eafit_orders') || '[]');
      ordenes.unshift(nuevaOrden);
      localStorage.setItem('eafit_orders', JSON.stringify(ordenes));
      localStorage.setItem('eafit_active_order_id', nuevaOrden.id);
      localStorage.removeItem('eafit_cart');

      window.location.href = 'seguimiento.html';
    }

    renderizarResumen();
  </script>
</body>
</html>
