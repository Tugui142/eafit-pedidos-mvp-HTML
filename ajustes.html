<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ajustes de Cuenta - EAFIT Pedidos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="pb-16 bg-slate-50">

  <!-- Navbar -->
  <header class="bg-eafit-oscuro text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center space-x-3">
      <button onclick="window.history.back()" class="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center hover:bg-white/20">
        <i class="fa-solid fa-arrow-left text-sm"></i>
      </button>
      <h1 class="font-bold text-base">Ajustes y Perfil</h1>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-6 space-y-6">
    
    <!-- Perfil de Usuario -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 text-center">
      <div class="w-20 h-20 bg-blue-100 text-blue-900 rounded-full flex items-center justify-center mx-auto mb-3 text-3xl border-4 border-white shadow-sm">
        <i class="fa-solid fa-user-graduate"></i>
      </div>
      <h2 class="text-lg font-extrabold text-slate-800">Perfil Activo</h2>
      <p class="text-sm font-semibold text-blue-900 mt-1" id="lblEmail">Cargando...</p>
      <p class="text-xs text-slate-500 uppercase tracking-widest mt-1">Rol: <span id="lblRol" class="font-bold">...</span></p>
    </div>

    <!-- Permisos de la App -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-4">
      <h3 class="text-xs font-bold uppercase text-slate-400 tracking-wider">Permisos del Sistema</h3>
      
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center">
            <i class="fa-solid fa-location-crosshairs"></i>
          </div>
          <div>
            <p class="text-sm font-bold text-slate-800">Geolocalización (Campus)</p>
            <p class="text-[10px] text-slate-500" id="lblGeoText">Permiso concedido</p>
          </div>
        </div>
        <div class="w-10 h-6 bg-emerald-500 rounded-full flex items-center justify-end p-1 shadow-inner">
          <div class="w-4 h-4 bg-white rounded-full"></div>
        </div>
      </div>
    </div>

    <!-- Zona de Peligro / Pruebas -->
    <div class="bg-red-50 p-4 rounded-2xl shadow-sm border border-red-100 space-y-4">
      <h3 class="text-xs font-bold uppercase text-red-400 tracking-wider">Zona de Pruebas (Developer)</h3>
      
      <button onclick="limpiarDatos()" class="w-full py-3 bg-white border border-red-200 text-red-600 rounded-xl text-sm font-bold flex items-center justify-center gap-2 hover:bg-red-100 transition">
        <i class="fa-solid fa-broom"></i> Borrar Base de Datos Local (Reset)
      </button>
      <p class="text-[10px] text-red-400 text-center leading-tight">Esto eliminará todos los pedidos, carritos y catálogos de prueba guardados en este navegador.</p>
    </div>

    <button onclick="cerrarSesion()" class="w-full py-3.5 bg-slate-800 text-white rounded-xl text-sm font-bold flex items-center justify-center gap-2 shadow-sm hover:bg-slate-900 transition">
      <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión y Volver al Inicio
    </button>

  </main>

  <script>
    // Cargar datos actuales
    document.getElementById('lblEmail').textContent = localStorage.getItem('eafit_user_email') || 'Sin sesión activa';
    document.getElementById('lblRol').textContent = localStorage.getItem('eafit_rol_activo') || 'Desconocido';
    
    const geo = localStorage.getItem('eafit_geo_permiso') === 'true';
    if (!geo) {
      document.getElementById('lblGeoText').textContent = 'Permiso denegado o pendiente';
    }

    function cerrarSesion() {
      // Borrar solo la sesión, mantener los pedidos
      localStorage.removeItem('eafit_user_email');
      localStorage.removeItem('eafit_rol_activo');
      window.location.href = 'index.html';
    }

    function limpiarDatos() {
      if(confirm('¿Estás seguro de querer borrar todos los pedidos, carritos y datos guardados? La app quedará como nueva.')) {
        localStorage.clear();
        alert('Datos locales borrados con éxito.');
        window.location.href = 'index.html';
      }
    }
  </script>
</body>
</html>
