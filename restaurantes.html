<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAFIT Pedidos - Restaurantes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#EFEFEF] text-[#222222] font-sans h-screen flex flex-col items-center">

    <!-- Contenedor Wrapper para simular App Móvil -->
    <div class="max-w-md w-full mx-auto bg-white min-h-screen relative shadow-2xl pb-24 border-x border-gray-200">
        
        <!-- Navbar -->
        <nav class="bg-white p-4 shadow-sm flex items-center gap-4 sticky top-0 z-40">
            <button onclick="window.location.href='catalogo.html'" class="bg-gray-100 p-2 rounded-full shadow-sm font-bold text-sm active:scale-95 transition-transform">← Volver</button>
            <h1 class="font-bold text-lg">Restaurantes</h1>
        </nav>

        <div class="p-5 space-y-6">
            <div>
                <h2 class="text-2xl font-black text-gray-900">Locales en el Campus</h2>
                <p class="text-sm text-gray-500 font-semibold mt-1">Descubre qué comer hoy en EAFIT</p>
            </div>

            <!-- Lista de Restaurantes (Basado en la web de EAFIT) -->
            <div id="restaurantes-list" class="space-y-4">
                
                <!-- Tarjeta 1 -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col gap-3">
                    <div class="flex items-center gap-4">
                        <div class="w-16 h-16 bg-gray-100 rounded-lg flex items-center justify-center text-2xl shadow-inner">🍔</div>
                        <div>
                            <h4 class="font-black text-gray-900 text-lg">The Corral</h4>
                            <p class="text-xs text-gray-500 font-bold">📍 Plazoleta del Estudiante</p>
                        </div>
                    </div>
                    <button onclick="window.location.href='catalogo.html'" class="w-full bg-gray-900 text-white font-bold py-2.5 rounded-lg text-sm hover:bg-gray-800 active:scale-95 transition-transform">Ver menú</button>
                </div>

                <!-- Tarjeta 2 -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col gap-3">
                    <div class="flex items-center gap-4">
                        <div class="w-16 h-16 bg-gray-100 rounded-lg flex items-center justify-center text-2xl shadow-inner">🍗</div>
                        <div>
                            <h4 class="font-black text-gray-900 text-lg">Frisby</h4>
                            <p class="text-xs text-gray-500 font-bold">📍 Plazoleta de los Árboles</p>
                        </div>
                    </div>
                    <button onclick="window.location.href='catalogo.html'" class="w-full bg-gray-900 text-white font-bold py-2.5 rounded-lg text-sm hover:bg-gray-800 active:scale-95 transition-transform">Ver menú</button>
                </div>

                <!-- Tarjeta 3 -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col gap-3">
                    <div class="flex items-center gap-4">
                        <div class="w-16 h-16 bg-gray-100 rounded-lg flex items-center justify-center text-2xl shadow-inner">🥗</div>
                        <div>
                            <h4 class="font-black text-gray-900 text-lg">Sol y Melón</h4>
                            <p class="text-xs text-gray-500 font-bold">📍 Bloque 19</p>
                        </div>
                    </div>
                    <button onclick="window.location.href='catalogo.html'" class="w-full bg-gray-900 text-white font-bold py-2.5 rounded-lg text-sm hover:bg-gray-800 active:scale-95 transition-transform">Ver menú</button>
                </div>
                
                <!-- Tarjeta 4 -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col gap-3">
                    <div class="flex items-center gap-4">
                        <div class="w-16 h-16 bg-gray-100 rounded-lg flex items-center justify-center text-2xl shadow-inner">☕</div>
                        <div>
                            <h4 class="font-black text-gray-900 text-lg">De Lolita</h4>
                            <p class="text-xs text-gray-500 font-bold">📍 Biblioteca</p>
                        </div>
                    </div>
                    <button onclick="window.location.href='catalogo.html'" class="w-full bg-gray-900 text-white font-bold py-2.5 rounded-lg text-sm hover:bg-gray-800 active:scale-95 transition-transform">Ver menú</button>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
