<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Historial - EAFIT Pedidos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <!-- Hotjar Tracking Code for Restaurantes EAFIT 2026-2 -->
  <script>
      (function(h,o,t,j,a,r){
          h.hj=h.hj||function(){(h.hj.q=h.hj.q||[]).push(arguments)};
          h._hjSettings={hjid:6847286,hjsv:6};
          a=o.getElementsByTagName('head')[0];
          r=o.createElement('script');r.async=1;
          r.src=t+h._hjSettings.hjid+j+h._hjSettings.hjsv;
          a.appendChild(r);
      })(window,document,'https://static.hotjar.com/c/hotjar-','.js?sv=');
  </script>
</head>
<body class="pb-16">

  <!-- Navbar -->
  <header class="bg-eafit-oscuro text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="catalogo.html" class="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center hover:bg-white/20">
          <i class="fa-solid fa-arrow-left text-sm"></i>
        </a>
        <div>
          <h1 class="font-bold text-base">Historial de Pedidos</h1>
          <p class="text-[11px] text-blue-200" id="userEmailDisplay">Cargando usuario...</p>
        </div>
      </div>
      <a href="ajustes.html" class="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center hover:bg-white/20">
        <i class="fa-solid fa-gear text-sm"></i>
      </a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 pt-5 space-y-4" id="historialContainer">
    <!-- El historial se renderiza aquí por JS -->
  </main>

  <script>
    document.getElementById('userEmailDisplay').textContent = localStorage.getItem('eafit_user_email') || 'Estudiante EAFIT';

    function verSeguimiento(orderId) {
      localStorage.setItem('eafit_active_order_id', orderId);
      window.location.href = 'seguimientos/seguimiento1.html?id=' + encodeURIComponent(orderId);
    }

    function renderizarHistorial() {
      const cont = document.getElementById('historialContainer');
      // Solo los pedidos del comprador que inició sesión
      const email = localStorage.getItem('eafit_user_email') || 'estudiante@eafit.edu.co';
      const ordenes = JSON.parse(localStorage.getItem('eafit_orders') || '[]').filter(o => o.comprador === email);

      if (ordenes.length === 0) {
        cont.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center border border-slate-200 shadow-sm mt-4">
            <div class="w-16 h-16 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
              <i class="fa-solid fa-receipt"></i>
            </div>
            <h2 class="text-base font-bold text-slate-800">Aún no tienes pedidos</h2>
            <p class="text-xs text-slate-500 mt-1 mb-4">Explora el catálogo y apoya a los restaurantes y emprendedores del campus.</p>
            <a href="catalogo.html" class="px-5 py-2.5 bg-eafit-oscuro text-white rounded-xl text-sm font-bold shadow-sm">Ir al Catálogo</a>
          </div>
        `;
        return;
      }

      cont.innerHTML = ordenes.map(o => {
        const esActivo = o.estado !== 'Entregado';
        const colorBadge = esActivo ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800';
        
        return `
          <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm relative overflow-hidden">
            ${esActivo ? '<div class="absolute left-0 top-0 bottom-0 w-1 bg-amber-400"></div>' : '<div class="absolute left-0 top-0 bottom-0 w-1 bg-emerald-500"></div>'}
            
            <div class="flex justify-between items-start mb-2 pl-2">
              <div>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wide ${colorBadge}">
                  ${o.estado}
                </span>
                <h3 class="font-extrabold text-slate-900 mt-1 text-base">${o.id}</h3>
                <p class="text-[11px] text-slate-500"><i class="fa-regular fa-clock"></i> ${o.fecha} · ${o.horario}</p>
              </div>
              <p class="font-black text-eafit-oscuro text-lg">$${o.total.toLocaleString('es-CO')}</p>
            </div>

            <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-100 pl-2 ml-2 mb-3">
              <p class="text-xs font-semibold text-slate-700">
                ${o.items.map(i => `${i.cantidad}x ${i.prodName}`).join(', ')}
              </p>
              <p class="text-[10px] text-slate-500 mt-1">
                <i class="fa-solid fa-location-dot"></i> ${esActivo ? 'Destino' : 'Entregado en'}: ${o.ubicacion.bloque}
              </p>
            </div>

            <div class="flex gap-2 pl-2">
              ${esActivo ? `
                <button onclick="verSeguimiento('${o.id}')" class="flex-1 py-2 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold rounded-xl flex items-center justify-center gap-1.5 transition">
                  <i class="fa-solid fa-satellite-dish"></i> Ver Seguimiento
                </button>
              ` : `
                <button onclick="verSeguimiento('${o.id}')" class="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold rounded-xl flex items-center justify-center gap-1.5 transition">
                  <i class="fa-solid fa-receipt"></i> Ver Recibo
                </button>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    renderizarHistorial();
  </script>
</body>
</html>
