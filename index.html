<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EAFIT Pedidos - Ingreso Institucional</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-[#002855] to-[#004B87]">

  <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden">
    <!-- Header Institucional -->
    <div class="bg-eafit-oscuro p-6 text-center text-white relative">
      <div class="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center mx-auto mb-3 border border-white/20">
        <i class="fa-solid fa-utensils text-2xl text-yellow-400"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-tight">EAFIT Pedidos</h1>
      <p class="text-xs text-blue-200 mt-1">Ecosistema Gastronómico y Colaborativo del Campus</p>
    </div>

    <div class="p-6 space-y-5">
      <!-- Correo Institucional -->
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Correo Institucional</label>
        <div class="relative">
          <i class="fa-solid fa-envelope absolute left-3.5 top-3 text-slate-400"></i>
          <input id="emailInput" type="email" value="usuario@eafit.edu.co" 
            class="w-full pl-10 pr-4 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-900" 
            placeholder="usuario@eafit.edu.co" />
        </div>
      </div>

      <!-- Paso 1: Activar Permisos (Geolocalización) -->
      <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <div id="geoIcon" class="w-10 h-10 rounded-lg bg-amber-100 text-amber-600 flex items-center justify-center">
              <i class="fa-solid fa-location-dot text-lg"></i>
            </div>
            <div>
              <p class="text-sm font-semibold text-slate-800">Permisos del Campus</p>
              <p id="geoStatusText" class="text-xs text-slate-500">Geolocalización y notificaciones requeridas</p>
            </div>
          </div>
          <button id="btnGeo" onclick="activarPermisos()" 
            class="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white text-xs font-semibold rounded-lg transition shadow-sm">
            Activar
          </button>
        </div>
      </div>

      <!-- Paso 2: Selección de los 4 Roles -->
      <div>
        <p class="text-xs font-semibold uppercase text-slate-500 mb-2.5">Selecciona tu Rol para Ingresar</p>
        <div class="grid grid-cols-1 gap-2.5">
          
          <button onclick="ingresarRol('comprador', 'catalogo.html')" 
            class="role-btn flex items-center justify-between p-3.5 rounded-xl border border-slate-200 hover:border-blue-900 hover:bg-blue-50/50 transition text-left group">
            <div class="flex items-center space-x-3">
              <span class="w-10 h-10 rounded-lg bg-blue-100 text-blue-900 flex items-center justify-center font-bold">
                <i class="fa-solid fa-user-graduate"></i>
              </span>
              <div>
                <p class="text-sm font-bold text-slate-800 group-hover:text-blue-900">Estudiante (Comprador)</p>
                <p class="text-xs text-slate-500">Pide ahora, reserva horario o apoya emprendimientos</p>
              </div>
            </div>
            <i class="fa-solid fa-chevron-right text-slate-400 group-hover:text-blue-900"></i>
          </button>

          <button onclick="ingresarRol('emprendedor', 'emprendedor.html')" 
            class="role-btn flex items-center justify-between p-3.5 rounded-xl border border-slate-200 hover:border-emerald-700 hover:bg-emerald-50/50 transition text-left group">
            <div class="flex items-center space-x-3">
              <span class="w-10 h-10 rounded-lg bg-emerald-100 text-emerald-800 flex items-center justify-center font-bold">
                <i class="fa-solid fa-store"></i>
              </span>
              <div>
                <p class="text-sm font-bold text-slate-800 group-hover:text-emerald-800">Emprendedor Estudiantil</p>
                <p class="text-xs text-slate-500">Actualiza stock diario y gestiona entregas en el campus</p>
              </div>
            </div>
            <i class="fa-solid fa-chevron-right text-slate-400 group-hover:text-emerald-800"></i>
          </button>

          <button onclick="ingresarRol('delivery', 'delivery.html')" 
            class="role-btn flex items-center justify-between p-3.5 rounded-xl border border-slate-200 hover:border-amber-600 hover:bg-amber-50/50 transition text-left group">
            <div class="flex items-center space-x-3">
              <span class="w-10 h-10 rounded-lg bg-amber-100 text-amber-700 flex items-center justify-center font-bold">
                <i class="fa-solid fa-person-walking-luggage"></i>
              </span>
              <div>
                <p class="text-sm font-bold text-slate-800 group-hover:text-amber-700">Delivery Colaborativo</p>
                <p class="text-xs text-slate-500">Activa tu disponibilidad y lleva pedidos entre bloques</p>
              </div>
            </div>
            <i class="fa-solid fa-chevron-right text-slate-400 group-hover:text-amber-700"></i>
          </button>

          <button onclick="ingresarRol('restaurante', 'dashboard.html')" 
            class="role-btn flex items-center justify-between p-3.5 rounded-xl border border-slate-200 hover:border-purple-700 hover:bg-purple-50/50 transition text-left group">
            <div class="flex items-center space-x-3">
              <span class="w-10 h-10 rounded-lg bg-purple-100 text-purple-800 flex items-center justify-center font-bold">
                <i class="fa-solid fa-kitchen-set"></i>
              </span>
              <div>
                <p class="text-sm font-bold text-slate-800 group-hover:text-purple-800">Restaurante</p>
                <p class="text-xs text-slate-500">Panel de cocina y despacho de órdenes</p>
              </div>
            </div>
            <i class="fa-solid fa-chevron-right text-slate-400 group-hover:text-purple-800"></i>
          </button>

        </div>
      </div>

      <p id="alertMsg" class="hidden text-xs text-center text-red-600 font-medium bg-red-50 py-2 rounded-lg border border-red-200">
        Por favor activa los permisos de geolocalización antes de ingresar.
      </p>
    </div>
  </div>

  <script>
    let permisosActivos = localStorage.getItem('eafit_geo_permiso') === 'true';

    function actualizarUIPermisos() {
      const btn = document.getElementById('btnGeo');
      const status = document.getElementById('geoStatusText');
      const icon = document.getElementById('geoIcon');
      if (permisosActivos) {
        btn.textContent = 'Activo ✓';
        btn.className = 'px-3 py-1.5 bg-emerald-600 text-white text-xs font-semibold rounded-lg cursor-default';
        status.textContent = 'GPS del campus activo (Bloque 26 detectado)';
        status.className = 'text-xs text-emerald-700 font-medium';
        icon.className = 'w-10 h-10 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center';
        document.getElementById('alertMsg').classList.add('hidden');
      }
    }

    function activarPermisos() {
      permisosActivos = true;
      localStorage.setItem('eafit_geo_permiso', 'true');
      actualizarUIPermisos();
    }

    function ingresarRol(rol, destino) {
      const email = document.getElementById('emailInput').value.trim();
      if (!email.endsWith('@eafit.edu.co')) {
        const alertMsg = document.getElementById('alertMsg');
        alertMsg.textContent = 'Usa tu correo institucional (@eafit.edu.co)';
        alertMsg.classList.remove('hidden');
        return;
      }
      if (!permisosActivos) {
        const alertMsg = document.getElementById('alertMsg');
        alertMsg.textContent = 'Debes activar los permisos (Geolocalización) primero.';
        alertMsg.classList.remove('hidden');
        return;
      }
      localStorage.setItem('eafit_rol_activo', rol);
      localStorage.setItem('eafit_user_email', email);
      window.location.href = destino;
    }

    actualizarUIPermisos();
  </script>
</body>
</html>
