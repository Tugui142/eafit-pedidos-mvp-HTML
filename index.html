<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EAFIT Pedidos - Onboarding e Ingreso</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            eafit: {
              oscuro: 'var(--eafit-azul-oscuro)',
              claro: 'var(--eafit-azul-claro)',
              amarillo: 'var(--eafit-amarillo)',
              arena: 'var(--eafit-arena)'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#EFEFEF] text-[#222222] font-sans">

  <!-- Contenedor Wrapper Móvil Original -->
  <div class="max-w-md mx-auto bg-white min-h-screen relative shadow-2xl border-x border-gray-200 flex flex-col justify-between">
    
    <!-- Header Institucional -->
    <div class="bg-eafit-oscuro p-7 text-center text-white rounded-b-3xl shadow-md">
      <div class="w-16 h-16 bg-white/10 rounded-2xl flex items-center justify-center mx-auto mb-3 text-3xl shadow-inner border border-white/20">
        🍽️
      </div>
      <h1 class="text-3xl font-black tracking-tight">EAFIT Pedidos</h1>
      <p class="text-xs font-semibold text-eafit-amarillo mt-1">Sin filas · Pide anticipado o recibe en tu bloque</p>
    </div>

    <!-- Cuerpo de Onboarding y Login -->
    <div class="p-6 space-y-5 flex-1">
      
      <!-- Correo Institucional -->
      <div>
        <label class="block text-xs font-black uppercase text-gray-500 mb-1.5 tracking-wider">Correo Institucional</label>
        <input id="emailInput" type="email" value="estudiante@eafit.edu.co" 
          class="w-full px-4 py-3 text-sm font-semibold border border-gray-200 rounded-xl bg-gray-50 focus:bg-white focus:outline-none focus:border-gray-900" 
          placeholder="usuario@eafit.edu.co" />
      </div>

      <!-- Onboarding Permiso de Ubicación y Mapa -->
      <div class="bg-gray-50 p-4 rounded-2xl border border-gray-200 space-y-3">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <span class="text-2xl">📍</span>
            <div>
              <h2 class="font-black text-sm text-gray-900">Permiso de Geolocalización</h2>
              <p id="geoStatusText" class="text-xs text-gray-500 font-medium">Actívalo para ver saturación del campus</p>
            </div>
          </div>
          <button id="btnGeo" onclick="activarPermisos()" 
            class="bg-gray-900 text-white font-bold px-3.5 py-2 rounded-xl text-xs active:scale-95 transition-transform">
            Activar GPS
          </button>
        </div>
      </div>

      <!-- Selección de los 4 Roles -->
      <div class="space-y-2.5">
        <label class="block text-xs font-black uppercase text-gray-500 tracking-wider">Ingresa según tu Rol</label>

        <button onclick="ingresarRol('comprador', 'catalogo.html')" 
          class="w-full p-4 rounded-xl border border-gray-200 hover:border-gray-900 bg-white flex items-center justify-between shadow-sm active:scale-95 transition-transform text-left">
          <div class="flex items-center gap-3.5">
            <span class="w-11 h-11 rounded-xl bg-gray-100 flex items-center justify-center text-xl">🎒</span>
            <div>
              <h3 class="font-black text-gray-900 text-sm">Estudiante (Comprador)</h3>
              <p class="text-xs text-gray-500 font-medium">Explorar catálogo, restaurantes y emprendimientos</p>
            </div>
          </div>
          <span class="font-black text-gray-400">→</span>
        </button>

        <button onclick="ingresarRol('emprendedor', 'emprendedor.html')" 
          class="w-full p-4 rounded-xl border border-gray-200 hover:border-gray-900 bg-white flex items-center justify-between shadow-sm active:scale-95 transition-transform text-left">
          <div class="flex items-center gap-3.5">
            <span class="w-11 h-11 rounded-xl bg-emerald-50 flex items-center justify-center text-xl">🌱</span>
            <div>
              <h3 class="font-black text-gray-900 text-sm">Emprendedor Estudiantil</h3>
              <p class="text-xs text-gray-500 font-medium">Publicar stock diario y despachar pedidos</p>
            </div>
          </div>
          <span class="font-black text-gray-400">→</span>
        </button>

        <button onclick="ingresarRol('delivery', 'delivery.html')" 
          class="w-full p-4 rounded-xl border border-gray-200 hover:border-gray-900 bg-white flex items-center justify-between shadow-sm active:scale-95 transition-transform text-left">
          <div class="flex items-center gap-3.5">
            <span class="w-11 h-11 rounded-xl bg-amber-50 flex items-center justify-center text-xl">🏃</span>
            <div>
              <h3 class="font-black text-gray-900 text-sm">Delivery Colaborativo</h3>
              <p class="text-xs text-gray-500 font-medium">Lleva pedidos a bloques y valida con PIN / QR</p>
            </div>
          </div>
          <span class="font-black text-gray-400">→</span>
        </button>

        <button onclick="ingresarRol('restaurante', 'dashboard.html')" 
          class="w-full p-4 rounded-xl border border-gray-200 hover:border-gray-900 bg-white flex items-center justify-between shadow-sm active:scale-95 transition-transform text-left">
          <div class="flex items-center gap-3.5">
            <span class="w-11 h-11 rounded-xl bg-blue-50 flex items-center justify-center text-xl">👨‍🍳</span>
            <div>
              <h3 class="font-black text-gray-900 text-sm">Restaurante</h3>
              <p class="text-xs text-gray-500 font-medium">Comandas en cocina y entrega a repartidores</p>
            </div>
          </div>
          <span class="font-black text-gray-400">→</span>
        </button>
      </div>

      <p id="alertMsg" class="hidden text-xs text-center text-red-600 font-bold bg-red-50 p-3 rounded-xl border border-red-200">
        Activa primero el permiso de Geolocalización para continuar.
      </p>
    </div>

    <footer class="p-4 text-center text-[11px] text-gray-400 border-t border-gray-100">
      Universidad EAFIT · Experiencia de Usuario 2026-2
    </footer>
  </div>

  <script>
    let permisosActivos = localStorage.getItem('eafit_geo_permiso') === 'true';

    function actualizarUIPermisos() {
      const btn = document.getElementById('btnGeo');
      const status = document.getElementById('geoStatusText');
      if (permisosActivos) {
        btn.textContent = 'GPS Activo ✓';
        btn.className = 'bg-emerald-600 text-white font-bold px-3.5 py-2 rounded-xl text-xs';
        status.textContent = 'Ubicación detectada en el Campus EAFIT';
        status.className = 'text-xs text-emerald-700 font-bold';
        document.getElementById('alertMsg').classList.add('hidden');
      }
    }

    function activarPermisos() {
      permisosActivos = true;
      localStorage.setItem('eafit_geo_permiso', 'true');
      actualizarUIPermisos();
    }

    function ingresarRol(rol, destino) {
      const email = document.getElementById('emailInput').value.trim();
      if (!email.endsWith('@eafit.edu.co')) {
        const alertMsg = document.getElementById('alertMsg');
        alertMsg.textContent = 'Ingresa con tu correo institucional (@eafit.edu.co)';
        alertMsg.classList.remove('hidden');
        return;
      }
      if (!permisosActivos) {
        const alertMsg = document.getElementById('alertMsg');
        alertMsg.textContent = 'Debes activar los permisos (Geolocalización) primero.';
        alertMsg.classList.remove('hidden');
        return;
      }
      localStorage.setItem('eafit_rol_activo', rol);
      localStorage.setItem('eafit_user_email', email);
      window.location.href = destino;
    }

    actualizarUIPermisos();
  </script>
</body>
</html>
