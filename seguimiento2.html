<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Entrega en Curso - EAFIT Pedidos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="../style.css" />
  <script>
    tailwind.config = {
      theme: { extend: { colors: { eafit: { oscuro: 'var(--eafit-azul-oscuro)', amarillo: 'var(--eafit-amarillo)' } } } }
    }
  </script>
  <!-- Hotjar Tracking Code for Restaurantes EAFIT 2026-2 -->
  <script>
      (function(h,o,t,j,a,r){
          h.hj=h.hj||function(){(h.hj.q=h.hj.q||[]).push(arguments)};
          h._hjSettings={hjid:6847286,hjsv:6};
          a=o.getElementsByTagName('head')[0];
          r=o.createElement('script');r.async=1;
          r.src=t+h._hjSettings.hjid+j+h._hjSettings.hjsv;
          a.appendChild(r);
      })(window,document,'https://static.hotjar.com/c/hotjar-','.js?sv=');
  </script>
</head>
<body class="bg-[#EFEFEF] text-[#222222] font-sans pb-16">

  <!-- SEGUIMIENTO 2 · Vista del REPARTIDOR (Delivery colaborativo) -->
  <div class="max-w-md mx-auto bg-white min-h-screen relative shadow-2xl border-x border-gray-200 flex flex-col">
    <header class="bg-eafit-oscuro text-white sticky top-0 z-30 shadow-md">
      <div class="px-4 py-3 flex items-center space-x-3">
        <a href="../delivery.html" class="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center hover:bg-white/20">
          <i class="fa-solid fa-arrow-left text-sm"></i>
        </a>
        <div>
          <h1 class="font-bold text-base">Mi Entrega en Curso</h1>
          <p class="text-[11px] text-amber-300" id="orderHeaderSub">Delivery Colaborativo</p>
        </div>
      </div>
    </header>

    <main class="px-4 pt-5 space-y-5 flex-1" id="mainTracking">
      <!-- Renderizado por JS -->
    </main>
  </div>

  <script>
    const COMISION = 3000;
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const leerOrdenes = () => JSON.parse(localStorage.getItem('eafit_orders') || '[]');

    const PASOS = [
      'Domicilio aceptado',
      'Llevando el pedido a su bloque',
      'Llegaste: comprador notificado',
      'Entrega validada con PIN'
    ];

    // Pedido del repartidor: el indicado en ?id=, o el primer domicilio que ya aceptó (estado "En camino").
    function obtenerOrden() {
      const id = new URLSearchParams(location.search).get('id');
      const lista = leerOrdenes().filter(o => (o.modoEntrega || '').includes('Repartidor'));
      return lista.find(o => o.id === id) || lista.find(o => o.estado === 'En camino') || null;
    }

    function actualizarOrden(id, cambios) {
      const ordenes = leerOrdenes();
      const idx = ordenes.findIndex(o => o.id === id);
      if (idx === -1) return false;
      Object.assign(ordenes[idx], cambios);
      localStorage.setItem('eafit_orders', JSON.stringify(ordenes));
      return true;
    }

    function notificarLlegada(id) {
      actualizarOrden(id, { alertaLlegada: true });
      renderizar();
    }

    function validarEntrega(id, simularQR) {
      const orden = leerOrdenes().find(o => o.id === id);
      if (!orden) return;
      const valor = (document.getElementById('pinInput')?.value || '').trim();
      if (simularQR || valor === orden.pin) {
        actualizarOrden(id, { estado: 'Entregado' });
        renderizar();
      } else {
        const msg = document.getElementById('pinError');
        msg.textContent = 'Código PIN incorrecto. Pídele al comprador el PIN que ve en su seguimiento.';
        msg.classList.remove('hidden');
      }
    }

    function mensajeVacio(titulo, texto) {
      return `
        <div class="bg-gray-50 p-6 rounded-2xl text-center border border-gray-200">
          <p class="text-sm font-black text-gray-800">${titulo}</p>
          <p class="text-xs text-gray-500 mt-1 mb-3">${texto}</p>
          <a href="../delivery.html" class="inline-block px-4 py-2 bg-eafit-oscuro text-white rounded-xl text-xs font-bold">Ir al Panel Delivery</a>
        </div>`;
    }

    function renderizar() {
      const cont = document.getElementById('mainTracking');
      const orden = obtenerOrden();

      if (!orden) {
        cont.innerHTML = mensajeVacio('No tienes una entrega en curso', 'Acepta un domicilio disponible desde tu panel para empezar.');
        return;
      }
      if (orden.estado !== 'En camino' && orden.estado !== 'Entregado') {
        cont.innerHTML = mensajeVacio('Aún no has aceptado este domicilio', 'Acéptalo desde tu panel para ver aquí la ruta y los pasos de la entrega.');
        return;
      }

      document.getElementById('orderHeaderSub').textContent = `${orden.id} · ${orden.horario}`;
      const entregado = orden.estado === 'Entregado';
      const paso = entregado ? 3 : (orden.alertaLlegada ? 2 : 1);
      const origen = (orden.items && orden.items[0] && orden.items[0].storeName) || 'Comercio Campus';

      const timelineHTML = PASOS.map((texto, index) => {
        const completado = index <= paso;
        const actual = index === paso && !entregado;
        return `
          <div class="flex items-start space-x-4 relative">
            <div class="flex flex-col items-center z-10">
              <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-black transition-all ${completado ? 'bg-gray-900 text-white shadow-md' : 'bg-gray-200 text-gray-400'} ${actual ? 'ring-4 ring-gray-300 scale-110' : ''}">
                ${completado ? '✓' : index + 1}
              </div>
              ${index < PASOS.length - 1 ? `<div class="w-1 h-10 -my-1 ${index < paso ? 'bg-gray-900' : 'bg-gray-200'}"></div>` : ''}
            </div>
            <div class="pt-1.5 pb-6">
              <p class="text-sm font-black ${completado ? 'text-gray-900' : 'text-gray-400'}">${texto}</p>
              ${actual ? `<p class="text-[10px] text-gray-500 font-bold bg-gray-100 inline-block px-2 py-0.5 rounded mt-1">Paso actual</p>` : ''}
            </div>
          </div>`;
      }).join('');

      let accionesHTML = '';
      if (entregado) {
        accionesHTML = `
          <div class="bg-emerald-50 border border-emerald-200 text-emerald-800 p-4 rounded-2xl text-center">
            <p class="font-black text-sm">¡Entrega validada con éxito!</p>
            <p class="text-xs mt-1">Se acreditaron $${COMISION.toLocaleString('es-CO')} a tu cuenta colaborativa.</p>
            <a href="../delivery.html" class="inline-block mt-2 text-xs font-bold underline">Volver al panel</a>
          </div>`;
      } else if (!orden.alertaLlegada) {
        accionesHTML = `
          <button onclick="notificarLlegada('${esc(orden.id)}')" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-white font-black text-sm rounded-xl flex items-center justify-center gap-2 active:scale-95 transition-transform">
            <i class="fa-solid fa-bell"></i> Notificar llegada al comprador
          </button>`;
      } else {
        accionesHTML = `
          <div class="space-y-2">
            <p class="text-xs font-bold text-gray-600">Pídele al comprador su PIN de 4 dígitos (o escanea su QR) para validar la entrega.</p>
            <div class="flex gap-2">
              <input id="pinInput" type="text" inputmode="numeric" maxlength="4" placeholder="PIN del comprador"
                class="flex-1 px-3 py-2.5 text-sm border border-gray-300 rounded-xl font-black tracking-widest" />
              <button onclick="validarEntrega('${esc(orden.id)}', false)" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-black rounded-xl">Validar PIN</button>
              <button onclick="validarEntrega('${esc(orden.id)}', true)" title="Escanear QR" class="px-3 py-2.5 bg-gray-900 text-white text-xs font-black rounded-xl"><i class="fa-solid fa-qrcode"></i> QR</button>
            </div>
            <p id="pinError" class="hidden text-xs font-bold text-red-600 bg-red-50 border border-red-200 p-2 rounded-lg"></p>
          </div>`;
      }

      const productos = (orden.items || []).map(i => `<li>${esc(i.cantidad)}x ${esc(i.prodName)}</li>`).join('');

      cont.innerHTML = `
        <section class="bg-white rounded-3xl p-5 shadow-sm border border-gray-200 space-y-3">
          <div class="flex justify-between items-start gap-2">
            <div>
              <h2 class="text-lg font-black text-gray-900">${esc(orden.id)}</h2>
              <p class="text-xs text-gray-500">Recoger en: <strong>${esc(origen)}</strong></p>
            </div>
            <span class="text-xs font-black bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full">Comisión $${COMISION.toLocaleString('es-CO')}</span>
          </div>

          <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
            <p class="text-[11px] font-bold uppercase text-slate-500 mb-1">Ruta de entrega</p>
            <div class="grid grid-cols-3 gap-2 text-xs">
              <div class="bg-white p-2 rounded-lg border border-slate-200"><span class="text-slate-400 block text-[10px]">BLOQUE</span><strong>${esc(orden.ubicacion.bloque)}</strong></div>
              <div class="bg-white p-2 rounded-lg border border-slate-200"><span class="text-slate-400 block text-[10px]">PISO</span><strong>${esc(orden.ubicacion.piso)}</strong></div>
              <div class="bg-white p-2 rounded-lg border border-slate-200"><span class="text-slate-400 block text-[10px]">AULA / PUNTO</span><strong>${esc(orden.ubicacion.aula)}</strong></div>
            </div>
          </div>
          <ul class="text-xs font-semibold text-gray-700 space-y-0.5">${productos}</ul>
        </section>

        <section class="bg-white rounded-3xl p-5 shadow-sm border border-gray-200">
          <div class="mt-2 ml-2">${timelineHTML}</div>
        </section>

        <section class="space-y-2">${accionesHTML}</section>
      `;
    }

    window.addEventListener('storage', renderizar);
    renderizar();
  </script>
</body>
</html>
