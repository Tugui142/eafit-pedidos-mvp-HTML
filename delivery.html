<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delivery Colaborativo - EAFIT Pedidos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="pb-16">

  <header class="bg-eafit-oscuro text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center hover:bg-white/20">
          <i class="fa-solid fa-arrow-left text-sm"></i>
        </a>
        <div>
          <h1 class="font-bold text-base">Panel Delivery Colaborativo</h1>
          <p class="text-[11px] text-amber-300">Gana ingresos extra entre cambios de clase</p>
        </div>
      </div>

      <!-- Switch ON / OFF de Disponibilidad -->
      <div class="flex items-center space-x-2 bg-white/10 px-3 py-1.5 rounded-xl">
        <span id="switchLabel" class="text-xs font-bold text-emerald-300">Delivery ON</span>
        <button id="toggleDeliveryBtn" onclick="toggleDisponibilidad()" 
          class="w-12 h-6 bg-emerald-500 rounded-full p-1 flex items-center transition duration-300 justify-end">
          <span class="w-4 h-4 bg-white rounded-full shadow"></span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 pt-5 space-y-5">

    <!-- Estado apagado -->
    <div id="offBanner" class="hidden bg-slate-200 border border-slate-300 rounded-2xl p-6 text-center">
      <i class="fa-solid fa-power-off text-3xl text-slate-500 mb-2"></i>
      <h2 class="text-base font-bold text-slate-800">Modo Repartidor Desactivado (OFF)</h2>
      <p class="text-xs text-slate-600 mt-1">Activa el interruptor superior para visualizar y aceptar domicilios disponibles en el campus.</p>
    </div>

    <!-- Lista de Domicilios Disponibles y en Curso -->
    <div id="deliveryDashboard" class="space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider">Domicilios en el Campus</h2>
        <button onclick="crearDomicilioDemo()" class="text-xs font-bold text-blue-900 underline">
          + Generar Domicilio de Prueba
        </button>
      </div>

      <div id="deliveryOrdersList" class="space-y-4"></div>
    </div>

  </main>

  <script>
    let deliveryOn = localStorage.getItem('eafit_delivery_on') !== 'false';

    function toggleDisponibilidad() {
      deliveryOn = !deliveryOn;
      localStorage.setItem('eafit_delivery_on', deliveryOn);
      actualizarSwitchUI();
      renderizarDomicilios();
    }

    function actualizarSwitchUI() {
      const btn = document.getElementById('toggleDeliveryBtn');
      const lbl = document.getElementById('switchLabel');
      const offBanner = document.getElementById('offBanner');
      const dash = document.getElementById('deliveryDashboard');

      if (deliveryOn) {
        btn.className = 'w-12 h-6 bg-emerald-500 rounded-full p-1 flex items-center transition duration-300 justify-end';
        lbl.textContent = 'Delivery ON';
        lbl.className = 'text-xs font-bold text-emerald-300';
        offBanner.classList.add('hidden');
        dash.classList.remove('hidden');
      } else {
        btn.className = 'w-12 h-6 bg-slate-500 rounded-full p-1 flex items-center transition duration-300 justify-start';
        lbl.textContent = 'Delivery OFF';
        lbl.className = 'text-xs font-bold text-slate-300';
        offBanner.classList.remove('hidden');
        dash.classList.add('hidden');
      }
    }

    function crearDomicilioDemo() {
      const ordenes = JSON.parse(localStorage.getItem('eafit_orders') || '[]');
      const pinDemo = Math.floor(1000 + Math.random() * 9000).toString();
      const demo = {
        id: 'ORD-' + Math.floor(100 + Math.random() * 900),
        fecha: 'Ahora',
        comprador: 's0lid@eafit.edu.co',
        items: [{ prodName: 'Bowl Mexicano + Cold Brew', storeName: 'Bigos / Dulce Bloque 38', cantidad: 1, precio: 24500 }],
        total: 24500,
        horario: 'Inmediato (Consumir ya)',
        modoEntrega: 'Compañero Repartidor',
        ubicacion: {
          bloque: 'Bloque 38',
          piso: 'Piso 3',
          aula: 'Aula 304 (Diseño Interactivo)',
          direccionCompleta: 'Bloque 38 · Piso 3 · Aula 304 (Diseño Interactivo)'
        },
        estado: 'Buscando repartidor',
        alertaLlegada: false,
        pin: pinDemo
      };
      ordenes.unshift(demo);
      localStorage.setItem('eafit_orders', JSON.stringify(ordenes));
      localStorage.setItem('eafit_active_order_id', demo.id);
      renderizarDomicilios();
    }

    function aceptarDomicilio(id) {
      const ordenes = JSON.parse(localStorage.getItem('eafit_orders') || '[]');
      const idx = ordenes.findIndex(o => o.id === id);
      if (idx > -1) {
        ordenes[idx].estado = 'En camino';
        localStorage.setItem('eafit_orders', JSON.stringify(ordenes));
        renderizarDomicilios();
      }
    }

    function notificarLlegada(id) {
      const ordenes = JSON.parse(localStorage.getItem('eafit_orders') || '[]');
      const idx = ordenes.findIndex(o => o.id === id);
      if (idx > -1) {
        ordenes[idx].alertaLlegada = true;
        localStorage.setItem('eafit_orders', JSON.stringify(ordenes));
        alert('Alerta enviada al comprador. Solicítale el código PIN o escanea su QR.');
        renderizarDomicilios();
      }
    }

    function validarEntregaPin(id, simularQR = false) {
      const ordenes = JSON.parse(localStorage.getItem('eafit_orders') || '[]');
      const idx = ordenes.findIndex(o => o.id === id);
      if (idx === -1) return;

      const inputVal = document.getElementById('pin-input-' + id)?.value.trim();
      if (simularQR || inputVal === ordenes[idx].pin) {
        ordenes[idx].estado = 'Entregado';
        ordenes[idx].estadoEmprendedor = 'Entregado';
        localStorage.setItem('eafit_orders', JSON.stringify(ordenes));
        alert('¡Entrega validada con éxito! Se acreditaron $3.000 a tu cuenta colaborativa.');
        renderizarDomicilios();
      } else {
        alert('Código PIN incorrecto. Verifica el PIN en la pantalla de Seguimiento del comprador (PIN correcto: ' + ordenes[idx].pin + ').');
      }
    }

    function renderizarDomicilios() {
      const list = document.getElementById('deliveryOrdersList');
      const ordenes = JSON.parse(localStorage.getItem('eafit_orders') || '[]');

      if (ordenes.length === 0) {
        list.innerHTML = `
          <div class="bg-white rounded-2xl p-6 text-center border border-slate-200">
            <p class="text-sm text-slate-500">No hay pedidos pendientes en este instante.</p>
          </div>
        `;
        return;
      }

      list.innerHTML = ordenes.map(o => {
        const origen = o.items[0]?.storeName || 'Comercio Campus';
        const aceptado = o.estado === 'En camino' || o.estado === 'Entregado';

        return `
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
            <div class="flex justify-between items-start">
              <div>
                <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full ${
                  o.estado === 'Entregado' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                }">${o.estado}</span>
                <h3 class="text-base font-extrabold text-slate-900 mt-1">${o.id} · Comisión: $3.000</h3>
                <p class="text-xs text-slate-500">Recoger en: <strong>${origen}</strong></p>
              </div>
              <span class="text-xs font-bold text-slate-600">${o.horario}</span>
            </div>

            <!-- Ruta Estructurada: Bloque + Piso + Aula -->
            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
              <p class="text-[11px] font-bold uppercase text-slate-500 mb-1">Ruta de Entrega Estructurada:</p>
              <div class="grid grid-cols-3 gap-2 text-xs">
                <div class="bg-white p-2 rounded-lg border border-slate-200">
                  <span class="text-slate-400 block text-[10px]">BLOQUE</span>
                  <strong class="text-slate-800">${o.ubicacion.bloque}</strong>
                </div>
                <div class="bg-white p-2 rounded-lg border border-slate-200">
                  <span class="text-slate-400 block text-[10px]">PISO</span>
                  <strong class="text-slate-800">${o.ubicacion.piso}</strong>
                </div>
                <div class="bg-white p-2 rounded-lg border border-slate-200">
                  <span class="text-slate-400 block text-[10px]">AULA / PUNTO</span>
                  <strong class="text-slate-800">${o.ubicacion.aula}</strong>
                </div>
              </div>
            </div>

            <!-- Controles según estado -->
            ${o.estado !== 'Entregado' ? `
              <div class="pt-2 flex flex-col sm:flex-row gap-2">
                ${!aceptado ? `
                  <button onclick="aceptarDomicilio('${o.id}')" 
                    class="w-full py-2.5 bg-eafit-oscuro hover:bg-blue-900 text-white text-xs font-bold rounded-xl">
                    Aceptar Domicilio Disponible
                  </button>
                ` : `
                  <button onclick="notificarLlegada('${o.id}')" 
                    class="px-4 py-2.5 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold rounded-xl flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-bell"></i> 1. Notificar Llegada
                  </button>
                  <div class="flex flex-1 gap-2">
                    <input id="pin-input-${o.id}" type="text" maxlength="4" placeholder="PIN comprador (ej. ${o.pin})"
                      class="flex-1 px-3 py-2 text-xs border border-slate-300 rounded-xl font-bold tracking-widest" />
                    <button onclick="validarEntregaPin('${o.id}', false)" 
                      class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl">
                      Validar PIN
                    </button>
                    <button onclick="validarEntregaPin('${o.id}', true)" title="Escanear QR"
                      class="px-3 py-2 bg-slate-800 text-white text-xs font-bold rounded-xl">
                      <i class="fa-solid fa-qrcode"></i> QR
                    </button>
                  </div>
                `}
              </div>
            ` : `
              <p class="text-xs font-bold text-emerald-700"><i class="fa-solid fa-circle-check"></i> Domicilio entregado y validado con PIN ${o.pin}</p>
            `}
          </div>
        `;
      }).join('');
    }

    actualizarSwitchUI();
    renderizarDomicilios();
  </script>
</body>
</html>
