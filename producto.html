<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del producto</title>
    
    <!-- Enlace al nuevo CSS de EAFIT -->
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        eafit: {
                            oscuro: 'var(--eafit-azul-oscuro)',
                            claro: 'var(--eafit-azul-claro)',
                            amarillo: 'var(--eafit-amarillo)',
                            arena: 'var(--eafit-arena)'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#EFEFEF] text-[#222222] font-sans h-screen flex flex-col items-center">

    <!-- Contenedor Wrapper -->
    <div class="max-w-md w-full bg-white shadow-2xl h-full flex flex-col relative border-x border-gray-200">
        
        <nav class="absolute top-0 w-full p-4 flex items-center gap-4 z-10">
            <button onclick="window.history.back()" class="bg-white/80 backdrop-blur-sm p-2 rounded-full shadow-sm font-bold text-sm active:scale-95">← Volver</button>
        </nav>

        <div class="flex-1 overflow-y-auto">
            <img id="prod-img" class="w-full h-72 object-cover grayscale">
            <div class="bg-white p-6 rounded-t-3xl -mt-8 relative shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.1)] space-y-4">
                <h1 id="prod-restaurant" class="font-bold text-gray-500 uppercase text-xs tracking-wider"></h1>
                <h2 id="prod-name" class="text-3xl font-black text-gray-900 leading-tight"></h2>
                <p id="prod-price" class="text-2xl font-bold text-gray-700"></p>
                
                <hr class="border-gray-100 my-4">
                
                <h3 class="font-bold text-lg">Opciones</h3>
                <div class="space-y-3">
                    <label class="flex items-center gap-3 p-3 border border-gray-200 rounded-lg bg-gray-50 cursor-pointer">
                        <input type="checkbox" checked class="w-5 h-5 accent-gray-900"> 
                        <span class="text-sm font-semibold">¿En combo? (+ $4.000)</span>
                    </label>
                    <label class="flex items-center gap-3 p-3 border border-gray-200 rounded-lg cursor-pointer">
                        <input type="checkbox" class="w-5 h-5 accent-gray-900"> 
                        <span class="text-sm font-semibold">Sin salsas</span>
                    </label>
                </div>
            </div>
        </div>

        <div class="bg-white p-5 border-t border-gray-100 space-y-3 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)]">
            <button onclick="addToCart()" class="w-full bg-gray-900 text-white font-bold py-3.5 rounded-xl hover:bg-gray-800 active:scale-95 transition-transform shadow-md">
                PEDIR (Agregar al Carrito)
            </button>
            <button onclick="window.history.back()" class="w-full bg-white text-gray-900 border-2 border-gray-900 font-bold py-3.5 rounded-xl hover:bg-gray-50 active:scale-95 transition-transform">
                Seguir buscando
            </button>
        </div>
    </div>

    <script>
        const product = JSON.parse(localStorage.getItem('selectedProduct'));
        if(!product) window.location.href = 'catalogo.html';

        document.getElementById('prod-restaurant').innerText = product.restaurante;
        document.getElementById('prod-name').innerText = product.plato;
        document.getElementById('prod-price').innerText = `$${product.precio.toLocaleString()}`;
        document.getElementById('prod-img').src = product.img;

        function addToCart() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.push(product);
            localStorage.setItem('cart', JSON.stringify(cart));
            window.location.href = 'pago.html';
        }
    </script>
</body>
</html>
