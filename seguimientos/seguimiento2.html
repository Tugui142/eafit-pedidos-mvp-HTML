<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seguimiento Casillero - EAFIT Pedidos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body class="bg-[#EFEFEF] text-[#222222] font-sans pb-16">

  <div class="max-w-md mx-auto bg-white min-h-screen relative shadow-2xl border-x border-gray-200 flex flex-col">
    <header class="bg-blue-900 text-white sticky top-0 z-30 shadow-md">
      <div class="px-4 py-3 flex items-center space-x-3">
        <a href="../catalogo.html" class="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center hover:bg-white/20">
          <i class="fa-solid fa-arrow-left text-sm"></i>
        </a>
        <div>
          <h1 class="font-bold text-base">Entrega en Casillero</h1>
          <p class="text-[11px] text-blue-200" id="orderHeaderSub">Preparando...</p>
        </div>
      </div>
    </header>

    <main class="px-4 pt-5 space-y-5 flex-1" id="mainTracking"></main>
  </div>

  <div id="modalApertura" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl space-y-4">
      <div class="w-16 h-16 bg-blue-100 text-blue-900 rounded-full flex items-center justify-center mx-auto text-3xl">
        📦
      </div>
      <div>
        <h3 class="text-xl font-black text-gray-900 mt-2">Abre tu Casillero</h3>
        <p class="text-xs text-gray-500 mt-1 font-semibold">Digita este código en la pantalla del casillero para retirar tu comida.</p>
      </div>

      <div class="bg-gray-50 p-5 rounded-2xl border border-gray-200">
        <p id="modalPinCode" class="text-4xl font-black tracking-widest text-blue-900">----</p>
      </div>

      <button onclick="validarRetiroCasillero()" class="w-full py-3 bg-blue-900 text-white font-bold rounded-xl text-sm active:scale-95 transition-transform">
        Confirmar que ya lo retiré
      </button>
      <button onclick="cerrarModalApertura()" class="w-full py-2 bg-transparent text-gray-500 font-bold text-xs underline">
        Cerrar ventana
      </button>
    </div>
  </div>

  <script>
    // Línea de tiempo específica para CASILLERO
    const ESTADOS = [
      { id: 'Recibido', text: 'Pedido Recibido' },
      { id: 'En cocina', text: 'Preparando' },
      { id: 'En camino', text: 'Enviando a zona de casilleros' },
      { id: 'Depositado', text: 'Depositado en Casillero' }, // Estado único
      { id: 'Entregado', text: 'Retirado por estudiante' }
    ];

    function obtenerOrdenActiva() {
      const ordenes = JSON.parse(localStorage.getItem('eafit_orders') || '[]');
      const idActivo = localStorage.getItem('eafit_active_order_id');
      return ordenes.find(o => o.id === idActivo) || null;
    }

    function actualizarEstadoManual(nuevoEstado) {
      const ordenes = JSON.parse(localStorage.getItem('eafit_orders') || '[]');
      const orden = obtenerOrdenActiva();
      if (!orden) return;
      const idx = ordenes.findIndex(o => o.id === orden.id);
      if (idx > -1) {
        ordenes[idx].estado = nuevoEstado;
        if (nuevoEstado === 'Depositado') ordenes[idx].alertaLlegada = true;
        localStorage.setItem('eafit_orders', JSON.stringify(ordenes));
        renderizarSeguimiento();
      }
    }

    function abrirModalApertura() {
      const orden = obtenerOrdenActiva();
      if (!orden) return;
      document.getElementById('modalPinCode').textContent = orden.pin;
      const modal = document.getElementById('modalApertura');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function cerrarModalApertura() {
      document.getElementById('modalApertura').classList.add('hidden');
      document.getElementById('modalApertura').classList.remove('flex');
    }

    function validarRetiroCasillero() {
      actualizarEstadoManual('Entregado');
      cerrarModalApertura();
    }

    function renderizarSeguimiento() {
      const orden = obtenerOrdenActiva();
      const cont = document.getElementById('mainTracking');

      if (!orden || !orden.modoEntrega.includes('Casillero')) {
        cont.innerHTML = `<div class="bg-gray-50 p-6 rounded-2xl text-center text-sm font-semibold border border-gray-200">No hay pedido a Casillero activo.</div>`;
        return;
      }

      document.getElementById('orderHeaderSub').textContent = `Orden ${orden.id}`;
      let pasoAUsar = ESTADOS.findIndex(e => e.id === orden.estado);
      if (pasoAUsar === -1) {
        // Mapeo por si viene un estado de restaurante
        if (orden.estado === 'Buscando repartidor') pasoAUsar = 2; // En camino
        else pasoAUsar = 0;
      }

      const timelineHTML = ESTADOS.map((est, index) => {
        const completado = index <= pasoAUsar;
        const actual = index === pasoAUsar;
        return `
          <div class="flex items-start space-x-4 relative">
            <div class="flex flex-col items-center z-10">
              <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-black transition-all ${
                completado ? 'bg-blue-900 text-white shadow-md' : 'bg-gray-200 text-gray-400'
              } ${actual ? 'ring-4 ring-blue-200 scale-110' : ''}">
                ${completado ? '✓' : index + 1}
              </div>
              ${index < ESTADOS.length - 1 ? `<div class="w-1 h-10 -my-1 ${index < pasoAUsar ? 'bg-blue-900' : 'bg-gray-200'}"></div>` : ''}
            </div>
            <div class="pt-1.5 pb-6">
              <p class="text-sm font-black ${completado ? 'text-gray-900' : 'text-gray-400'}">${est.text}</p>
            </div>
          </div>
        `;
      }).join('');

      cont.innerHTML = `
        ${orden.alertaLlegada && orden.estado !== 'Entregado' ? `
          <div class="bg-blue-100 text-blue-900 p-4 rounded-2xl shadow-sm flex items-center justify-between border border-blue-200">
            <div class="flex items-center gap-3">
              <span class="text-3xl">📦</span>
              <div>
                <p class="font-black text-sm leading-tight">¡Pedido en Casillero!</p>
                <p class="text-[10px] font-bold">Ubicado en: ${orden.ubicacion.bloque}</p>
              </div>
            </div>
            <button onclick="abrirModalApertura()" class="px-3 py-2 bg-blue-900 text-white font-bold text-xs rounded-xl shadow-sm">ABRIR</button>
          </div>
        ` : ''}

        <section class="bg-white rounded-3xl p-5 shadow-sm border border-gray-200">
          <div class="mt-2 ml-2">${timelineHTML}</div>
        </section>

        <!-- Developer Box -->
        <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
          <p class="text-[10px] font-black uppercase text-gray-400 mb-2 text-center">Simulador Casillero</p>
          <div class="flex flex-wrap gap-1.5 justify-center">
            ${ESTADOS.map(e => `<button onclick="actualizarEstadoManual('${e.id}')" class="px-2 py-1 text-[10px] font-bold rounded-lg border ${orden.estado === e.id ? 'bg-blue-900 text-white' : 'bg-white text-gray-600'}">${e.text}</button>`).join('')}
          </div>
        </div>
      `;
    }

    window.addEventListener('storage', renderizarSeguimiento);
    renderizarSeguimiento();
  </script>
</body>
</html>
