<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Restaurante - EAFIT Pedidos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="pb-16">
  <header class="bg-eafit-oscuro text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center hover:bg-white/20">
          <i class="fa-solid fa-arrow-left text-sm"></i>
        </a>
        <h1 class="font-bold text-base">Panel de Cocina (Restaurantes Campus)</h1>
      </div>
      <a href="seguimiento.html" class="text-xs bg-white/10 px-3 py-1.5 rounded-lg">Ir a Seguimiento</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 pt-5 space-y-4">
    <div id="restOrders" class="space-y-3"></div>
  </main>

  <script>
    function cambiarEstado(id, estado) {
      const ordenes = JSON.parse(localStorage.getItem('eafit_orders') || '[]');
      const idx = ordenes.findIndex(o => o.id === id);
      if (idx > -1) {
        ordenes[idx].estado = estado;
        localStorage.setItem('eafit_orders', JSON.stringify(ordenes));
        render();
      }
    }

    function render() {
      const ordenes = JSON.parse(localStorage.getItem('eafit_orders') || '[]');
      const cont = document.getElementById('restOrders');
      if (ordenes.length === 0) {
        cont.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-sm text-slate-500">Sin órdenes activas en cocina.</div>`;
        return;
      }
      cont.innerHTML = ordenes.map(o => `
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between gap-3">
          <div>
            <span class="text-xs font-bold bg-blue-100 text-blue-900 px-2.5 py-0.5 rounded-full">${o.estado}</span>
            <h3 class="font-bold text-base mt-1">${o.id} · ${o.horario}</h3>
            <p class="text-xs text-slate-600">${o.items.map(i => `${i.cantidad}x ${i.prodName}`).join(', ')}</p>
            <p class="text-xs text-slate-400 mt-1">Destino: ${o.ubicacion.direccionCompleta}</p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="cambiarEstado('${o.id}', 'En cocina')" class="px-3 py-2 bg-amber-500 text-white text-xs font-bold rounded-xl">Pasar a En Cocina</button>
            <button onclick="cambiarEstado('${o.id}', 'Buscando repartidor')" class="px-3 py-2 bg-eafit-oscuro text-white text-xs font-bold rounded-xl">Solicitar Repartidor</button>
          </div>
        </div>
      `).join('');
    }
    render();
  </script>
</body>
</html>
