<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASHBOARD</title>
    
    <!-- Enlace al nuevo CSS de EAFIT -->
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        eafit: {
                            oscuro: 'var(--eafit-azul-oscuro)',
                            claro: 'var(--eafit-azul-claro)',
                            amarillo: 'var(--eafit-amarillo)',
                            arena: 'var(--eafit-arena)'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#EFEFEF] text-[#222222] font-sans p-4 md:p-8 min-h-screen">

    <!-- Contenedor amplio para escritorio -->
    <div class="max-w-6xl mx-auto bg-white p-6 md:p-8 rounded-xl shadow-lg border border-gray-200">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end border-b border-gray-200 pb-4 mb-6 gap-4">
            <div>
                <h2 class="text-3xl font-black">👨‍🍳 The Corral - Dashboard</h2>
                <p class="text-sm font-semibold text-gray-500 mt-1">Gestión de comandas y comunicación</p>
            </div>
            
            <div class="space-x-6 flex overflow-x-auto w-full md:w-auto">
                <button id="tab-kanban" onclick="switchTab('kanban')" class="font-bold text-gray-900 border-b-4 border-gray-900 pb-2 transition-colors">Comandas</button>
                <button id="tab-inv" onclick="switchTab('inv')" class="font-bold text-gray-400 pb-2 border-b-4 border-transparent hover:text-gray-900 transition-colors">Inventario</button>
                <button id="tab-msg" onclick="switchTab('msg')" class="font-bold text-gray-400 pb-2 border-b-4 border-transparent hover:text-gray-900 transition-colors flex items-center gap-1">Mensajes <span id="msg-badge" class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full hidden">Nuevos</span></button>
            </div>
        </div>

        <!-- Módulo 1: Kanban (3 Columnas Lado a Lado en Desktop) -->
        <div id="view-kanban" class="grid grid-cols-1 md:grid-cols-3 gap-6 bg-gray-50 p-6 rounded-xl border border-gray-100 items-start">
            <div class="bg-gray-200 p-4 rounded-lg flex flex-col gap-3 shadow-inner">
                <div class="font-black text-sm text-yellow-800 uppercase tracking-wide flex justify-between">Pendientes <span>(1)</span></div>
                <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100 text-gray-800 relative cursor-pointer hover:shadow-md transition-shadow">
                    <span class="absolute top-2 right-2 w-3 h-3 bg-red-500 rounded-full animate-pulse"></span>
                    <p class="font-bold text-lg mb-1">#992</p>
                    <p class="text-sm font-semibold">1x Hamburguesa Todoterreno</p>
                    <p class="text-red-600 text-xs font-bold mt-2">🕒 12:30 PM</p>
                    <button class="w-full mt-3 bg-yellow-600 text-white font-bold py-2 rounded text-xs">Preparar</button>
                </div>
            </div>
            <div class="bg-gray-200 p-4 rounded-lg flex flex-col gap-3 shadow-inner min-h-[150px]">
                <div class="font-black text-sm text-blue-800 uppercase tracking-wide flex justify-between">En Preparación <span>(0)</span></div>
            </div>
            <div class="bg-gray-200 p-4 rounded-lg flex flex-col gap-3 shadow-inner min-h-[150px]">
                <div class="font-black text-sm text-green-800 uppercase tracking-wide flex justify-between">Listos <span>(0)</span></div>
            </div>
        </div>

        <!-- Módulo 2: Inventario -->
        <div id="view-inv" class="hidden bg-gray-50 p-6 rounded-xl border border-gray-100 space-y-4">
            <h3 class="font-bold text-xl">Inventario de Cocina</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="flex justify-between items-center bg-white p-4 border border-gray-200 rounded-lg shadow-sm">
                    <span class="font-bold">Hamburguesa Todoterreno</span> 
                    <span class="bg-red-100 text-red-800 px-3 py-1 rounded-full text-sm font-black">2 porciones</span>
                </div>
                <div class="flex justify-between items-center bg-white p-4 border border-gray-200 rounded-lg shadow-sm">
                    <span class="font-bold">Perro Sencillo</span> 
                    <span class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm font-black">15 porciones</span>
                </div>
            </div>
        </div>

        <!-- Módulo 3: Mensajería (Conectado a LocalStorage) -->
        <div id="view-msg" class="hidden bg-gray-50 p-6 rounded-xl border border-gray-100 flex flex-col h-[60vh]">
            <div class="flex justify-between items-center mb-4 border-b border-gray-200 pb-4">
                <h3 class="font-bold text-xl">Mensajes de usuarios</h3>
                <button onclick="loadMessages()" class="text-xs bg-gray-200 px-4 py-2 rounded-lg hover:bg-gray-300 font-bold active:scale-95 transition-transform flex items-center gap-2">↻ Actualizar Bandeja</button>
            </div>
            
            <div id="msg-container" class="space-y-4 overflow-y-auto pr-2 flex-1">
                <!-- Los mensajes se inyectan acá vía JavaScript -->
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabId) {
            ['kanban', 'inv', 'msg'].forEach(id => {
                document.getElementById('view-' + id).classList.add('hidden');
                document.getElementById('tab-' + id).classList.replace('text-gray-900', 'text-gray-400');
                document.getElementById('tab-' + id).classList.replace('border-gray-900', 'border-transparent');
            });
            document.getElementById('view-' + tabId).classList.remove('hidden');
            document.getElementById('tab-' + tabId).classList.replace('text-gray-400', 'text-gray-900');
            document.getElementById('tab-' + tabId).classList.replace('border-transparent', 'border-gray-900');

            if(tabId === 'msg') {
                loadMessages();
                document.getElementById('msg-badge').classList.add('hidden');
            }
        }

        function loadMessages() {
            const container = document.getElementById('msg-container');
            const msgs = JSON.parse(localStorage.getItem('mensajes_pedido')) || [];
            
            if(msgs.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-gray-400 mt-10">
                        <span class="text-4xl block mb-2">📭</span>
                        <p class="font-semibold text-sm">No hay mensajes recientes de los estudiantes.</p>
                    </div>`;
                return;
            }
            
            // Invertir para mostrar el más reciente arriba
            container.innerHTML = msgs.reverse().map(m => `
                <div class="bg-white p-4 border border-gray-200 rounded-lg shadow-sm border-l-4 border-l-blue-500 hover:shadow-md transition-shadow">
                    <p class="text-xs text-gray-500 font-black mb-2 uppercase tracking-wide">${m.user} - 🕒 ${m.time}</p>
                    <p class="text-base font-medium text-gray-800">"${m.msg}"</p>
                </div>
            `).join('');
        }

        // Chequear mensajes nuevos periódicamente (Simulación)
        setInterval(() => {
            const msgs = JSON.parse(localStorage.getItem('mensajes_pedido')) || [];
            if(msgs.length > 0 && document.getElementById('view-msg').classList.contains('hidden')) {
                document.getElementById('msg-badge').classList.remove('hidden');
            }
        }, 5000);

        // Cargar mensajes iniciales por si abrimos la vista directo en esa pestaña
        loadMessages();
    </script>
</body>
</html>
